  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>targz Design System<\u002Ftitle>\n\n\n\n<style>\n  :root {\n    \u002F* === CORE SURFACES === *\u002F\n    --tg-bg:        #FDF1E8;        \u002F* warm cream canvas *\u002F\n    --tg-bg-grid:   #EADFCE;        \u002F* grid line on canvas *\u002F\n    --tg-surface:   #FFFFFF;        \u002F* panel \u002F card *\u002F\n    --tg-surface-2: #F8F1E6;        \u002F* sunken \u002F muted row *\u002F\n    --tg-surface-3: #F4EADD;        \u002F* panel header strip *\u002F\n    --tg-surface-dark: #1a1a1a;     \u002F* dark pill \u002F console *\u002F\n    --tg-surface-dark-2: #0d0d0d;   \u002F* console bg *\u002F\n\n    \u002F* === BORDERS === *\u002F\n    --tg-border:    #EADFCE;        \u002F* hairline on panels *\u002F\n    --tg-border-2:  #E0D2BD;        \u002F* stronger divider *\u002F\n    --tg-border-dark: #2a2a2a;\n\n    \u002F* === TEXT === *\u002F\n    --tg-fg:        #1a1a1a;\n    --tg-fg-2:      #4a4a4a;\n    --tg-fg-3:      #8a8275;       \u002F* warm muted *\u002F\n    --tg-fg-on-dark: #f5f5f5;\n\n    \u002F* === BRAND \u002F STATE === *\u002F\n    --tg-orange:        #F26B1F;   \u002F* PRIMARY — action \u002F active \u002F sliders *\u002F\n    --tg-orange-hover:  #DD5E14;\n    --tg-orange-soft:   #FCE5D2;   \u002F* ghost bg *\u002F\n    --tg-green:         #16A34A;   \u002F* running \u002F launch \u002F success *\u002F\n    --tg-green-soft:    #DCFCE7;\n    --tg-red:           #EF4444;   \u002F* stop \u002F error *\u002F\n    --tg-red-soft:      #FEE2E2;\n    --tg-blue:          #2563EB;   \u002F* link \u002F port *\u002F\n    --tg-blue-soft:     #DBEAFE;\n\n    \u002F* === TYPE === *\u002F\n    --tg-font-sans: \"Inter\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    --tg-font-mono: \"JetBrains Mono\", \"SF Mono\", \"Menlo\", \"Consolas\", monospace;\n\n    \u002F* === RADII === *\u002F\n    --tg-r-sm: 4px;\n    --tg-r-md: 8px;\n    --tg-r-lg: 14px;\n    --tg-r-pill: 999px;\n\n    \u002F* === SHADOWS === *\u002F\n    --tg-shadow-panel: 0 1px 2px rgba(60,40,20,.04), 0 8px 24px rgba(60,40,20,.06);\n    --tg-shadow-pill:  0 2px 4px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.10);\n\n    \u002F* === GLASS (floating chrome over canvas) === *\u002F\n    --tg-glass:        hsla(0, 0%, 92%, 0.8);\n    --tg-glass-border: hsla(0, 0%, 100%, 0.5);\n    --tg-glass-hover:  hsla(0, 0%, 100%, 0.7);\n    --tg-shadow-float: 0 4px 24px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);\n    --tg-shadow-pop:   0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: var(--tg-font-sans);\n    font-size: 14px;\n    color: var(--tg-fg);\n    background: var(--tg-bg);\n    \u002F* the signature warm grid *\u002F\n    background-image:\n      linear-gradient(to right, var(--tg-bg-grid) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--tg-bg-grid) 1px, transparent 1px);\n    background-size: 40px 40px;\n    background-position: -1px -1px;\n    min-height: 100vh;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  \u002F* ============================================================\n     LAYOUT — Page is a long vertical doc with sections\n     ============================================================ *\u002F\n  .tg-page {\n    max-width: 1280px;\n    margin: 0 auto;\n    padding: 56px 32px 160px;\n  }\n  .tg-doc-head {\n    display: flex; align-items: baseline; gap: 12px;\n    margin-bottom: 6px;\n  }\n  .tg-doc-head h1 {\n    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;\n    margin: 0;\n  }\n  .tg-doc-head .tg-version {\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-fg-3);\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    padding: 2px 8px;\n    border-radius: var(--tg-r-pill);\n  }\n  .tg-doc-sub {\n    color: var(--tg-fg-3);\n    font-size: 13px;\n    margin: 0 0 48px;\n  }\n\n  .tg-section { margin: 64px 0 0; }\n  .tg-section-head {\n    display: flex; align-items: center; gap: 10px;\n    margin-bottom: 20px;\n    padding-bottom: 12px;\n    border-bottom: 1px solid var(--tg-border-2);\n  }\n  .tg-section-head h2 {\n    font-size: 11px;\n    font-weight: 600;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--tg-fg-2);\n    margin: 0;\n  }\n  .tg-section-head .tg-rule {\n    flex: 1; height: 1px;\n  }\n  .tg-section-head .tg-num {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n  }\n  .tg-section h3.tg-sub {\n    font-size: 11px; font-weight: 600;\n    text-transform: uppercase; letter-spacing: 0.1em;\n    color: var(--tg-fg-3);\n    margin: 28px 0 12px;\n  }\n\n  \u002F* GRID OF SAMPLES *\u002F\n  .tg-grid { display: grid; gap: 20px; }\n  .tg-grid-2 { grid-template-columns: repeat(2, 1fr); }\n  .tg-grid-3 { grid-template-columns: repeat(3, 1fr); }\n  .tg-grid-4 { grid-template-columns: repeat(4, 1fr); }\n  .tg-grid-6 { grid-template-columns: repeat(6, 1fr); }\n\n  \u002F* ============================================================\n     SAMPLE \u002F SPEC CARDS\n     ============================================================ *\u002F\n  .tg-sample {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 16px;\n    box-shadow: var(--tg-shadow-panel);\n  }\n  .tg-sample-label {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n  }\n\n  \u002F* ============================================================\n     COLOR SWATCHES\n     ============================================================ *\u002F\n  .tg-swatch {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    overflow: hidden;\n  }\n  .tg-swatch-color { height: 80px; border-bottom: 1px solid var(--tg-border); }\n  .tg-swatch-meta { padding: 10px 12px; }\n  .tg-swatch-name {\n    font-size: 12px; font-weight: 600;\n    color: var(--tg-fg);\n  }\n  .tg-swatch-token {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n    margin-top: 2px;\n  }\n  .tg-swatch-hex {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-2);\n    margin-top: 1px;\n  }\n\n  \u002F* ============================================================\n     SIDE PANEL (the signature right\u002Fleft config panel)\n     ============================================================ *\u002F\n  .tg-panel {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md) var(--tg-r-md) 4px 4px;\n    box-shadow: var(--tg-shadow-panel);\n    overflow: hidden;\n    width: 320px;\n    font-size: 12px;\n  }\n  .tg-panel-titlebar {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 8px 12px;\n    background: var(--tg-surface-3);\n    border-bottom: 1px solid var(--tg-border);\n    font-weight: 600;\n    font-size: 12px;\n    color: var(--tg-fg);\n  }\n  .tg-panel-titlebar .tg-grip {\n    color: var(--tg-fg-3); font-family: var(--tg-font-mono);\n    font-size: 14px; line-height: 1; cursor: ns-resize;\n    user-select: none;\n  }\n  .tg-panel-section {\n    padding: 6px 0;\n    border-bottom: 1px solid var(--tg-border);\n  }\n  .tg-panel-section:last-child { border-bottom: 0; }\n  .tg-panel-section-head {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 6px 12px 6px 14px;\n    position: relative;\n    font-weight: 600;\n    font-size: 12px;\n    color: var(--tg-fg);\n  }\n  .tg-panel-section-head::before {\n    content:\"\"; position:absolute; left: 0; top: 4px; bottom: 4px;\n    width: 3px; background: var(--tg-orange); border-radius: 0 2px 2px 0;\n  }\n  .tg-panel-section-head .tg-collapse {\n    color: var(--tg-fg-3); font-family: var(--tg-font-mono);\n    font-size: 12px; line-height: 1;\n  }\n\n  .tg-row {\n    display: grid;\n    grid-template-columns: 96px 1fr 44px;\n    align-items: center;\n    gap: 10px;\n    padding: 5px 12px;\n    min-height: 26px;\n  }\n  .tg-row-label {\n    font-size: 11px;\n    color: var(--tg-fg-2);\n    line-height: 1.25;\n  }\n  .tg-row-num {\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-fg);\n    text-align: right;\n  }\n\n  \u002F* SLIDER — orange pill thumb on hairline track *\u002F\n  .tg-slider {\n    -webkit-appearance: none; appearance: none;\n    width: 100%;\n    height: 14px;\n    background: transparent;\n  }\n  .tg-slider::-webkit-slider-runnable-track {\n    height: 1px; background: var(--tg-border-2);\n  }\n  .tg-slider::-moz-range-track {\n    height: 1px; background: var(--tg-border-2);\n  }\n  .tg-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    width: 12px; height: 12px;\n    background: var(--tg-orange);\n    border-radius: 2px;\n    margin-top: -6px;\n    cursor: pointer;\n    border: none;\n  }\n  .tg-slider::-moz-range-thumb {\n    width: 12px; height: 12px;\n    background: var(--tg-orange);\n    border-radius: 2px;\n    border: none;\n    cursor: pointer;\n  }\n\n  \u002F* SELECT — orange filled when active *\u002F\n  .tg-select {\n    appearance: none; -webkit-appearance: none;\n    width: 100%;\n    height: 22px;\n    padding: 0 22px 0 8px;\n    background:\n      linear-gradient(45deg, transparent 50%, #fff 50%) calc(100% - 8px) 50% \u002F 5px 5px no-repeat,\n      linear-gradient(135deg, #fff 50%, transparent 50%) calc(100% - 3px) 50% \u002F 5px 5px no-repeat,\n      var(--tg-orange);\n    color: #fff;\n    font-family: var(--tg-font-sans);\n    font-size: 11px;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.04em;\n    border: none;\n    border-radius: 3px;\n    cursor: pointer;\n  }\n\n  \u002F* CHECKBOX — minimal *\u002F\n  .tg-check {\n    width: 14px; height: 14px;\n    border: 1px solid var(--tg-border-2);\n    border-radius: 2px;\n    background: var(--tg-surface);\n    display: inline-flex; align-items: center; justify-content: center;\n    cursor: pointer;\n  }\n  .tg-check.is-on::after {\n    content:\"\"; width: 8px; height: 8px;\n    background: var(--tg-fg);\n    clip-path: polygon(14% 44%, 0% 60%, 40% 100%, 100% 18%, 84% 4%, 38% 60%);\n  }\n\n  \u002F* TEXT INPUT-LIKE FIELD *\u002F\n  .tg-field {\n    height: 22px;\n    border: 1px solid var(--tg-border-2);\n    border-radius: 3px;\n    padding: 0 8px;\n    background: var(--tg-surface);\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-fg);\n    display: flex; align-items: center;\n  }\n  .tg-field--swatch { padding-left: 4px; gap: 6px; }\n  .tg-field--swatch .tg-swatch-dot {\n    width: 16px; height: 16px; border-radius: 2px;\n    border: 1px solid var(--tg-border-2);\n  }\n\n  \u002F* ADD BUTTON \u002F PRIMARY ROW BUTTON *\u002F\n  .tg-btn-primary {\n    display: inline-flex; align-items: center; justify-content: center;\n    gap: 6px;\n    height: 28px; padding: 0 14px;\n    background: var(--tg-orange); color: #fff;\n    border: none; border-radius: 3px;\n    font-family: var(--tg-font-sans);\n    font-size: 12px; font-weight: 700;\n    text-transform: uppercase; letter-spacing: 0.04em;\n    cursor: pointer;\n  }\n  .tg-btn-primary:hover { background: var(--tg-orange-hover); }\n  .tg-btn-primary--block { width: 100%; }\n\n  \u002F* ============================================================\n     BUTTONS \u002F TAGS \u002F PILLS (from launchpad)\n     ============================================================ *\u002F\n  .tg-btn {\n    display: inline-flex; align-items: center; gap: 6px;\n    height: 30px; padding: 0 12px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border-2);\n    border-radius: 6px;\n    font: 500 12px var(--tg-font-sans);\n    color: var(--tg-fg);\n    cursor: pointer;\n  }\n  .tg-btn:hover { background: var(--tg-surface-3); }\n  .tg-btn--launch {\n    background: var(--tg-green-soft); color: #166534;\n    border-color: #BBF7D0;\n  }\n  .tg-btn--stop {\n    background: var(--tg-red-soft); color: #B91C1C;\n    border-color: #FECACA;\n  }\n  .tg-btn--dark {\n    background: var(--tg-surface-dark); color: #fff;\n    border-color: var(--tg-surface-dark);\n  }\n  .tg-btn--ghost { background: transparent; }\n  .tg-btn .dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: currentColor;\n  }\n\n  .tg-tag {\n    display: inline-flex; align-items: center;\n    height: 18px; padding: 0 8px;\n    border-radius: var(--tg-r-pill);\n    background: var(--tg-surface-3);\n    color: var(--tg-fg-3);\n    font: 500 10px var(--tg-font-sans);\n    text-transform: lowercase;\n    letter-spacing: 0.02em;\n  }\n  .tg-tag--node {\n    background: #F0FDF4; color: #15803D;\n    font-family: var(--tg-font-mono);\n    font-weight: 700; text-transform: uppercase;\n    letter-spacing: 0.06em;\n    height: 20px;\n  }\n\n  \u002F* SEGMENTED TABS (Favorites \u002F All \u002F Hidden) *\u002F\n  .tg-segment {\n    display: inline-flex; align-items: center; gap: 4px;\n    padding: 4px;\n    background: var(--tg-surface-dark);\n    border-radius: var(--tg-r-pill);\n  }\n  .tg-segment > button {\n    border: none; background: transparent;\n    color: #d4d4d4;\n    height: 28px; padding: 0 14px;\n    border-radius: var(--tg-r-pill);\n    font: 600 12px var(--tg-font-sans);\n    cursor: pointer;\n    display: inline-flex; align-items: center; gap: 8px;\n  }\n  .tg-segment > button.is-on {\n    background: var(--tg-orange); color: #fff;\n  }\n  .tg-segment > button .count {\n    background: rgba(255,255,255,.18);\n    padding: 1px 6px; border-radius: var(--tg-r-pill);\n    font-size: 10px;\n  }\n  .tg-segment > button.is-on .count { background: rgba(0,0,0,.18); }\n\n  \u002F* PORT PILL (localhost:3000 ...) *\u002F\n  .tg-port {\n    display: inline-flex; align-items: center; justify-content: space-between;\n    width: 100%;\n    height: 32px; padding: 0 10px;\n    background: var(--tg-blue-soft);\n    color: #1e40af;\n    border-radius: 6px;\n    font: 600 12px var(--tg-font-mono);\n  }\n  .tg-port .open {\n    color: var(--tg-blue);\n    font-family: var(--tg-font-sans);\n    font-weight: 500;\n    font-size: 11px;\n  }\n\n  \u002F* STATUS DOT *\u002F\n  .tg-status {\n    display: inline-flex; align-items: center; gap: 6px;\n    font-size: 11px; color: var(--tg-fg-3);\n  }\n  .tg-status .dot {\n    width: 8px; height: 8px; border-radius: 50%;\n    background: var(--tg-green); box-shadow: 0 0 0 2px rgba(22,163,74,.18);\n  }\n  .tg-status.is-off .dot { background: #d1d5db; box-shadow: none; }\n\n  \u002F* ============================================================\n     PROJECT CARD (launchpad)\n     ============================================================ *\u002F\n  .tg-card {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-left: 3px solid transparent;\n    border-radius: var(--tg-r-md);\n    padding: 16px;\n    box-shadow: var(--tg-shadow-panel);\n    display: flex; flex-direction: column; gap: 10px;\n  }\n  .tg-card--running { border-left-color: var(--tg-green); }\n  .tg-card-head {\n    display: flex; align-items: center; justify-content: space-between;\n  }\n  .tg-card-title {\n    font-size: 13px; font-weight: 600;\n    display: flex; align-items: center; gap: 6px;\n  }\n  .tg-card-title .scope { color: var(--tg-fg-3); font-weight: 500; }\n  .tg-card-title .star {\n    color: var(--tg-orange);\n  }\n  .tg-card-desc {\n    font-size: 12px; color: var(--tg-fg-2);\n    line-height: 1.4;\n  }\n  .tg-card-row { display: flex; align-items: center; gap: 8px; }\n  .tg-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }\n\n  \u002F* ============================================================\n     BOTTOM NAV (the floating dock)\n     ============================================================ *\u002F\n  .tg-dock {\n    display: inline-flex; align-items: center;\n    gap: 4px;\n    padding: 6px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-pill);\n    box-shadow: var(--tg-shadow-pill);\n  }\n  .tg-dock > button {\n    width: 36px; height: 36px;\n    border: none; background: transparent;\n    border-radius: 50%;\n    color: var(--tg-fg-2);\n    display: inline-flex; align-items: center; justify-content: center;\n    cursor: pointer;\n  }\n  .tg-dock > button:hover { background: var(--tg-surface-3); color: var(--tg-fg); }\n  .tg-dock > button.is-on {\n    background: var(--tg-orange-soft); color: var(--tg-orange);\n  }\n  .tg-dock > .tg-dock-meta {\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 0 14px 0 8px;\n    color: var(--tg-fg-2);\n    font: 500 12px var(--tg-font-mono);\n  }\n  .tg-dock > .tg-dock-meta .play {\n    width: 24px; height: 24px; border-radius: 50%;\n    background: var(--tg-fg); color: #fff;\n    display: inline-flex; align-items: center; justify-content: center;\n    font-size: 10px;\n  }\n  .tg-dock-divider {\n    width: 1px; height: 20px; background: var(--tg-border-2);\n    margin: 0 4px;\n  }\n\n  \u002F* ============================================================\n     LOG \u002F TOAST CARD (bottom-left console)\n     ============================================================ *\u002F\n  .tg-log {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 10px 14px;\n    max-width: 360px;\n    font: 11px\u002F1.6 var(--tg-font-mono);\n    color: var(--tg-fg-2);\n    box-shadow: var(--tg-shadow-panel);\n  }\n  .tg-log .ts { color: var(--tg-fg-3); }\n  .tg-log .ok { color: var(--tg-green); }\n  .tg-log .warn { color: var(--tg-orange); }\n  .tg-log .err { color: var(--tg-red); }\n\n  \u002F* CONSOLE BLOCK (bright) *\u002F\n  .tg-console {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    color: var(--tg-fg-2);\n    border-radius: var(--tg-r-md);\n    padding: 12px 14px;\n    font: 11px\u002F1.55 var(--tg-font-mono);\n    overflow: auto;\n  }\n  .tg-console > div { padding: 1px 0; word-break: break-all; }\n  .tg-console .cmd { color: var(--tg-fg); }\n  .tg-console .cmd::before { content: \"$ \"; color: var(--tg-orange); font-weight: 700; }\n  .tg-console .head {\n    color: var(--tg-fg); margin-bottom: 8px; padding-bottom: 8px;\n    border-bottom: 1px solid var(--tg-border);\n    display: flex; align-items: center; gap: 6px;\n    font-weight: 600;\n  }\n  .tg-console .head .dot {\n    width: 8px; height: 8px; border-radius: 50%;\n    background: var(--tg-green);\n  }\n\n  \u002F* ============================================================\n     TYPE SAMPLES\n     ============================================================ *\u002F\n  .tg-type {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 24px;\n    display: flex; flex-direction: column; gap: 4px;\n  }\n  .tg-type-name {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    text-transform: uppercase;\n    color: var(--tg-fg-3);\n    letter-spacing: 0.06em;\n  }\n  .tg-type-spec {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n  }\n\n  \u002F* ============================================================\n     RADIUS \u002F SHADOW \u002F SPACING TOKENS\n     ============================================================ *\u002F\n  .tg-token {\n    display: flex; align-items: center; gap: 14px;\n    padding: 14px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n  }\n  .tg-token-vis { width: 64px; height: 64px; flex: none; background: var(--tg-surface-3); border: 1px solid var(--tg-border-2); }\n  .tg-token-meta { display: flex; flex-direction: column; gap: 2px; }\n  .tg-token-name { font-size: 12px; font-weight: 600; }\n  .tg-token-detail { font-family: var(--tg-font-mono); font-size: 10px; color: var(--tg-fg-3); }\n\n  .tg-spacer {\n    background: var(--tg-orange);\n    height: 16px;\n  }\n\n  \u002F* ============================================================\n     PRINCIPLES TEXT\n     ============================================================ *\u002F\n  .tg-principle {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 22px 24px;\n  }\n  .tg-principle .num {\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-orange);\n    margin-bottom: 8px;\n  }\n  .tg-principle h4 {\n    margin: 0 0 6px;\n    font-size: 16px;\n    font-weight: 600;\n    letter-spacing: -0.01em;\n  }\n  .tg-principle p {\n    margin: 0;\n    font-size: 13px;\n    line-height: 1.5;\n    color: var(--tg-fg-2);\n  }\n\n  \u002F* hide scroll on inset console *\u002F\n  .tg-console::-webkit-scrollbar { width: 6px; height: 6px; }\n  .tg-console::-webkit-scrollbar-thumb { background: var(--tg-border-2); border-radius: 3px; }\n\n  \u002F* ============================================================\n     STAGE — wraps live demos with a soft inset\n     ============================================================ *\u002F\n  .tg-stage {\n    background: var(--tg-bg);\n    background-image:\n      linear-gradient(to right, var(--tg-bg-grid) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--tg-bg-grid) 1px, transparent 1px);\n    background-size: 28px 28px;\n    border: 1px solid var(--tg-border-2);\n    border-radius: var(--tg-r-md);\n    padding: 32px;\n    display: flex; align-items: center; justify-content: center;\n    min-height: 220px;\n    position: relative;\n  }\n  .tg-stage--tall { min-height: 360px; }\n  .tg-stage--two { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; }\n\n  \u002F* ============================================================\n     NAV BAR — the floating glass dock (as shipped in the apps)\n     ============================================================ *\u002F\n  .tg-navbar {\n    display: flex;\n    background: var(--tg-glass);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    border: 1px solid var(--tg-glass-border);\n    border-radius: 18px;\n    box-shadow: var(--tg-shadow-float);\n    padding: 6px 10px;\n    user-select: none;\n  }\n  .tg-navmenu { display: flex; list-style: none; margin: 0; padding: 0; gap: 2px; align-items: center; }\n  .tg-navmenu > li {\n    position: relative; width: 40px; height: 40px;\n    display: flex; align-items: center; justify-content: center;\n    cursor: pointer; color: var(--tg-fg-2);\n    border-radius: 12px;\n    transition: background .15s, color .15s;\n  }\n  .tg-navmenu > li:hover, .tg-navmenu > li.is-open { background: var(--tg-glass-hover); color: var(--tg-fg); }\n  .tg-navmenu > li.is-on { color: var(--tg-orange); }\n  .tg-navmenu > .tg-navsep {\n    width: 1px; height: 24px; background: hsla(0,0%,0%,.10);\n    margin: 0 4px; border-radius: 0; cursor: default;\n  }\n  .tg-navmenu > .tg-navsep:hover { background: hsla(0,0%,0%,.10); }\n  .tg-navmenu > .tg-navstatus {\n    width: auto; padding: 0 8px; font-size: 11px; font-weight: 500;\n    color: var(--tg-fg-3); cursor: default;\n  }\n  .tg-navmenu > .tg-navstatus:hover { background: transparent; color: var(--tg-fg-3); }\n\n  .tg-navpop {\n    position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%);\n    background: var(--tg-surface); border: 1px solid var(--tg-border);\n    border-radius: 14px; box-shadow: var(--tg-shadow-pop);\n    min-width: 220px; list-style: none; margin: 0; padding: 6px; white-space: nowrap;\n  }\n  .tg-navpop::after {\n    content: ''; position: absolute; bottom: -7px; left: 50%;\n    transform: translateX(-50%) rotate(45deg);\n    width: 12px; height: 12px; background: var(--tg-surface);\n    border-right: 1px solid var(--tg-border); border-bottom: 1px solid var(--tg-border);\n  }\n  .tg-navpop > li {\n    padding: 8px 12px; cursor: pointer; color: var(--tg-fg);\n    font-size: 13px; font-weight: 500; border-radius: 8px;\n    display: flex; align-items: center; gap: 10px;\n    transition: background .15s;\n  }\n  .tg-navpop > li:hover { background: hsla(0,0%,0%,.04); }\n  .tg-kbd { margin-left: auto; display: flex; gap: 3px; }\n  .tg-kbd kbd {\n    background: hsla(0,0%,0%,.06); border: 1px solid hsla(0,0%,0%,.08);\n    border-radius: 4px; padding: 1px 5px; font-size: 11px;\n    font-family: inherit; color: var(--tg-fg-2);\n  }\n\n  \u002F* ============================================================\n     LOG — toast + on-demand history\n     ============================================================ *\u002F\n  .tg-toast {\n    display: inline-flex; align-items: center; gap: 9px;\n    max-width: 420px; padding: 8px 14px;\n    background: var(--tg-glass);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    border: 1px solid var(--tg-glass-border);\n    border-radius: 12px;\n    box-shadow: var(--tg-shadow-float);\n    font-size: 12px; color: var(--tg-fg);\n  }\n  .tg-toast i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--tg-fg-3); }\n  .tg-toast--ok i   { background: var(--tg-green); }\n  .tg-toast--warn i { background: var(--tg-orange); }\n  .tg-toast--err    { background: var(--tg-red-soft); border-color: #FECACA; color: #B91C1C; }\n  .tg-toast--err i  { background: var(--tg-red); }\n  .tg-toast .rep {\n    font-size: 10px; font-weight: 600; padding: 1px 6px;\n    border-radius: var(--tg-r-pill);\n    background: hsla(0,0%,0%,.07); color: var(--tg-fg-2);\n  }\n  .tg-loghist {\n    background: var(--tg-surface); border: 1px solid var(--tg-border);\n    border-radius: 14px; box-shadow: var(--tg-shadow-pop);\n    min-width: 340px; padding: 6px 6px 0;\n  }\n  .tg-loghist .row { display: flex; gap: 10px; padding: 3px 6px; font-size: 11.5px; line-height: 1.5; }\n  .tg-loghist .row .ts { color: var(--tg-fg-3); }\n  .tg-loghist .foot {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 7px 6px; margin-top: 2px;\n    border-top: 1px solid var(--tg-border);\n    font-size: 11px; color: var(--tg-fg-3);\n  }\n  .tg-unread { position: relative; }\n  .tg-unread::after {\n    content: ''; position: absolute; top: 7px; right: 7px;\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--tg-orange); box-shadow: 0 0 0 2px var(--tg-glass);\n  }\n\n  \u002F* spec rows shared by the two sections above *\u002F\n  .tg-spec { display: grid; grid-template-columns: 150px 1fr; gap: 10px 16px; font-size: 12px; }\n  .tg-spec dt { color: var(--tg-fg); font-weight: 500; }\n  .tg-spec dd { margin: 0; color: var(--tg-fg-2); line-height: 1.5; }\n  .tg-spec code {\n    font-family: var(--tg-font-mono); font-size: 11px;\n    background: var(--tg-surface-2); padding: 1px 5px; border-radius: 3px;\n  }\n\n  \u002F* ============================================================\n     CONTENTS RAIL\n     ============================================================ *\u002F\n  .tg-toc {\n    position: fixed; top: 0; left: 0; bottom: 0; width: 232px; z-index: 300;\n    display: flex; flex-direction: column;\n    background: var(--tg-surface);\n    border-right: 1px solid var(--tg-border);\n  }\n  .tg-toc-head { padding: 22px 20px 14px; border-bottom: 1px solid var(--tg-border); }\n  .tg-toc-head strong { display: block; font-size: 13px; font-weight: 700; color: var(--tg-fg); letter-spacing: -.01em; }\n  .tg-toc-head span {\n    display: inline-block; margin-top: 6px;\n    font-family: var(--tg-font-mono); font-size: 10px; color: var(--tg-orange);\n    background: var(--tg-orange-soft); padding: 2px 8px; border-radius: var(--tg-r-pill);\n  }\n  .tg-toc-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 1px; }\n  .tg-toc-list a {\n    display: flex; align-items: center; gap: 9px;\n    padding: 6px 10px; border-radius: 8px;\n    font-size: 12px; font-weight: 500; color: var(--tg-fg-2);\n    text-decoration: none; transition: background .15s, color .15s;\n  }\n  .tg-toc-list a:hover { background: hsla(0,0%,0%,.04); color: var(--tg-fg); }\n  .tg-toc-list a.is-on { background: var(--tg-orange-soft); color: var(--tg-orange); font-weight: 600; }\n  .tg-toc-list a .n { font-family: var(--tg-font-mono); font-size: 10px; color: var(--tg-fg-3); }\n  .tg-toc-list a.is-on .n { color: var(--tg-orange); }\n  .tg-toc-foot { padding: 12px 20px; border-top: 1px solid var(--tg-border); font-size: 10px; color: var(--tg-fg-3); }\n\n  body { padding-left: 232px; }\n  html { scroll-behavior: smooth; }\n  .tg-section { scroll-margin-top: 24px; }\n  @media (max-width: 1080px) { body { padding-left: 0; } .tg-toc { display: none; } }\n\n  \u002F* ============================================================\n     TAB BAR — white pill, top centre. The page switcher.\n     ============================================================ *\u002F\n  .tg-tabs {\n    display: inline-flex; gap: 2px; padding: 4px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-pill);\n    box-shadow: var(--tg-shadow-panel);\n    user-select: none;\n  }\n  .tg-tabs button {\n    padding: 7px 20px; border: none; border-radius: var(--tg-r-pill);\n    background: transparent;\n    font-family: var(--tg-font-sans); font-size: 13px; font-weight: 600;\n    color: var(--tg-fg-2); cursor: pointer;\n    transition: background .15s, color .15s;\n  }\n  .tg-tabs button:hover { background: hsla(0,0%,0%,.04); color: var(--tg-fg); }\n  .tg-tabs button.is-on { background: var(--tg-orange-soft); color: var(--tg-orange); }\n  .tg-tabs button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(242,107,31,.35); }\n\n\n  \u002F* ============================================================\n     TWEAKPANE REPLICA\n     Static reproduction of a rendered Tweakpane 4 pane under our\n     skin. Geometry is from tweakpane's own stylesheet:\n     unit size 20px - container padding 4px - blade radius 2px -\n     track 2px - knob 12px square - value field right-aligned.\n     ============================================================ *\u002F\n  .tgtp {\n    width: 300px; background: #fff; border-radius: var(--tg-r-md);\n    box-shadow: var(--tg-shadow-panel); overflow: hidden;\n    font: 400 11px var(--tg-font-sans); color: var(--tg-fg);\n  }\n  .tgtp-bar {\n    display: flex; align-items: center; position: relative;\n    height: 26px; padding: 0 10px;\n    background: var(--tg-surface-3); font-weight: 600; cursor: grab;\n  }\n  .tgtp-bar .grip, .tgtp-fold .grip {\n    margin-left: auto; color: var(--tg-fg-3);\n    font-family: var(--tg-font-mono); font-size: 12px; line-height: 1;\n  }\n  .tgtp-fold {\n    display: flex; align-items: center; position: relative;\n    height: 26px; padding: 0 10px 0 13px;\n    background: var(--tg-surface-3); font-weight: 600; cursor: pointer;\n    border-left: 3px solid var(--tg-orange);\n  }\n  .tgtp-fold--settings { border-left-color: var(--tg-green); }\n  .tgtp-fold--layer    { border-left-color: var(--tg-blue); }\n  .tgtp-body { padding: 4px; display: flex; flex-direction: column; gap: 4px; }\n  .tgtp-row { display: flex; align-items: center; gap: 4px; min-height: 20px; }\n  .tgtp-lbl { flex: 1; padding-left: 4px; padding-right: 16px; color: var(--tg-fg-3); line-height: 1.25; }\n  .tgtp-ctl { flex: 1.3; display: flex; align-items: center; gap: 4px; }\n  .tgtp-track { flex: 1.3; height: 20px; position: relative; margin: 0 6px; cursor: pointer; }\n  .tgtp-track::before {\n    content: \"\"; position: absolute; inset: 0; margin: auto;\n    height: 2px; border-radius: 1px; background: var(--tg-surface-2);\n  }\n  .tgtp-track i { position: absolute; left: 0; top: 0; height: 100%; }\n  .tgtp-track i::before {\n    content: \"\"; position: absolute; inset: 0; margin: auto 0;\n    height: 2px; border-radius: 1px; background: var(--tg-fg);\n  }\n  .tgtp-track i::after {\n    content: \"\"; position: absolute; right: -6px; top: 0; bottom: 0; margin: auto;\n    width: 12px; height: 12px; border-radius: 2px; background: var(--tg-orange);\n  }\n  .tgtp-num {\n    flex: .8; height: 20px; display: flex; align-items: center; justify-content: flex-end;\n    padding: 0 4px; border-radius: 2px;\n    background: var(--tg-surface-2); color: var(--tg-fg);\n    font-family: var(--tg-font-mono); font-size: 11px;\n  }\n  .tgtp-ckb { width: 20px; height: 20px; border-radius: 2px; background: var(--tg-surface-2); }\n  .tgtp-sel {\n    flex: 1; height: 20px; display: flex; align-items: center; justify-content: space-between;\n    padding: 0 6px; border-radius: 2px;\n    background: var(--tg-orange); color: #fff;\n    font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .04em;\n  }\n  .tgtp-color {\n    flex: 1; height: 20px; display: flex; align-items: center; gap: 6px;\n    padding: 0 4px; border-radius: 2px; background: var(--tg-surface-2);\n    font-family: var(--tg-font-mono); font-size: 11px;\n  }\n  .tgtp-color i { width: 14px; height: 14px; border-radius: 2px; background: #000; }\n  .tgtp-btn {\n    height: 20px; width: 100%; border: none; border-radius: 2px;\n    background: var(--tg-orange); color: #fff;\n    font: 700 10px var(--tg-font-sans); text-transform: uppercase; letter-spacing: .04em;\n    cursor: pointer;\n  }\n\n  \u002F* ============================================================\n     CANVAS + GRID + RULERS\n     ============================================================ *\u002F\n  .tgcv {\n    position: relative; width: 100%; max-width: 620px; height: 340px;\n    background:\n      repeating-linear-gradient(to right, rgba(153,153,153,.2) 0 1px, transparent 1px 40px),\n      repeating-linear-gradient(to bottom, rgba(153,153,153,.2) 0 1px, transparent 1px 40px);\n    overflow: hidden;\n  }\n  .tgcv-paper {\n    position: absolute; left: 120px; top: 40px; width: 280px; height: 280px;\n    background: #fff;\n  }\n  .tgcv-tick { position: absolute; background: var(--tg-fg-3); opacity: .6; }\n  .tgcv-tick--b { width: 1px; height: 6px; }\n  .tgcv-tick--r { height: 1px; width: 6px; }\n  .tgcv-lbl {\n    position: absolute; font-size: 9px; font-weight: 400;\n    color: var(--tg-fg-3); white-space: nowrap;\n  }\n  .tgcv-lbl--b { transform: translateX(-50%); }\n  .tgcv-lbl--r { transform: translateY(-50%); }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n\n<nav class=\"tg-toc\" aria-label=\"Contents\">\n  <div class=\"tg-toc-head\">\n    <strong>targz Design System<\u002Fstrong>\n    <span>v1.0.0<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"tg-toc-list\" id=\"tg-toc-list\"><\u002Fdiv>\n  <div class=\"tg-toc-foot\">tokens &middot; components &middot; practice<\u002Fdiv>\n<\u002Fnav>\n\n<main class=\"tg-page\">\n\n  <!-- ===== HEADER ===== -->\n  <div class=\"tg-doc-head\">\n    <h1>targz Design System<\u002Fh1>\n    <span class=\"tg-version\">v1.0.0<\u002Fspan>\n  <\u002Fdiv>\n  <p class=\"tg-doc-sub\">Visual language extracted from Launchpad, Penplotter Control, Vpype Studio, Portrait-Y, Portrait-Voronoi, and Portrait-Layers.<\u002Fp>\n\n  <!-- ============================================================\n       1. PRINCIPLES\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">01<\u002Fspan>\n      <h2>Principles<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tg-grid tg-grid-3\">\n      <div class=\"tg-principle\">\n        <div class=\"num\">A<\u002Fdiv>\n        <h4>Warm paper, not cold UI<\u002Fh4>\n        <p>The canvas is a sheet of paper sitting on a drafting table. Cream background, faint ruled grid, hairline borders. Never gray-on-gray.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\">B<\u002Fdiv>\n        <h4>Orange is for action<\u002Fh4>\n        <p>One signature orange — used for active states, sliders, primary buttons, highlights. Everything else stays quiet so it stays loud.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\">C<\u002Fdiv>\n        <h4>Tools, not products<\u002Fh4>\n        <p>Dense panels, monospace coordinates, version chips, console output. The interface looks like a workshop, because that's what it is.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       2. COLOR\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">02<\u002Fspan>\n      <h2>Color<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Surfaces<\u002Fh3>\n    <div class=\"tg-grid tg-grid-4\">\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#FDF1E8\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Canvas<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-bg<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#FDF1E8<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#FFFFFF;border-bottom-color:#EADFCE\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Surface<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-surface<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#FFFFFF<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#F4EADD\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Header strip<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-surface-3<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#F4EADD<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#1a1a1a\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Surface dark<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-surface-dark<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#1A1A1A<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Brand &amp; State<\u002Fh3>\n    <div class=\"tg-grid tg-grid-4\">\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#F26B1F\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Orange — primary<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-orange<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#F26B1F<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#16A34A\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Green — running<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-green<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#16A34A<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#EF4444\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Red — stop<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-red<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#EF4444<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#2563EB\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Blue — link<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-blue<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#2563EB<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Text &amp; Borders<\u002Fh3>\n    <div class=\"tg-grid tg-grid-6\">\n      <div class=\"tg-swatch\"><div class=\"tg-swatch-color\" style=\"background:#1a1a1a;height:56px\"><\u002Fdiv><div class=\"tg-swatch-meta\"><div class=\"tg-swatch-name\">fg<\u002Fdiv><div class=\"tg-swatch-hex\">#1A1A1A<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-swatch\"><div class=\"tg-swatch-color\" style=\"background:#4a4a4a;height:56px\"><\u002Fdiv><div class=\"tg-swatch-meta\"><div class=\"tg-swatch-name\">fg-2<\u002Fdiv><div class=\"tg-swatch-hex\">#4A4A4A<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-swatch\"><div class=\"tg-swatch-color\" style=\"background:#8a8275;height:56px\"><\u002Fdiv><div class=\"tg-swatch-meta\"><div class=\"tg-swatch-name\">fg-3<\u002Fdiv><div class=\"tg-swatch-hex\">#8A8275<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-swatch\"><div class=\"tg-swatch-color\" style=\"background:#EADFCE;height:56px\"><\u002Fdiv><div class=\"tg-swatch-meta\"><div class=\"tg-swatch-name\">border<\u002Fdiv><div class=\"tg-swatch-hex\">#EADFCE<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-swatch\"><div class=\"tg-swatch-color\" style=\"background:#E0D2BD;height:56px\"><\u002Fdiv><div class=\"tg-swatch-meta\"><div class=\"tg-swatch-name\">border-2<\u002Fdiv><div class=\"tg-swatch-hex\">#E0D2BD<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-swatch\"><div class=\"tg-swatch-color\" style=\"background:#F8F1E6;height:56px\"><\u002Fdiv><div class=\"tg-swatch-meta\"><div class=\"tg-swatch-name\">surface-2<\u002Fdiv><div class=\"tg-swatch-hex\">#F8F1E6<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       3. CANVAS, GRID & RULERS\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">03<\u002Fspan>\n      <h2>Canvas, grid &amp; rulers<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin:-8px 0 16px\">\n      The paper is a white sheet centred on a warm drafting table. The grid is not decoration — it is registered to the sheet, and the rulers state the sheet's real size in millimetres.\n    <\u002Fp>\n\n    <div class=\"tg-stage\" style=\"padding:24px;min-height:400px\">\n      <div class=\"tgcv\">\n        <div class=\"tgcv-paper\"><\u002Fdiv>\n        <!-- bottom ruler: ticks every division, labels only at the two ends -->\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:120px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:160px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:200px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:240px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:280px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:320px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:360px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--b\" style=\"left:400px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-lbl tgcv-lbl--b\" style=\"left:120px;top:328px\">0<\u002Fdiv>\n        <div class=\"tgcv-lbl tgcv-lbl--b\" style=\"left:400px;top:328px\">594<\u002Fdiv>\n        <!-- right ruler: y counts up from the bottom -->\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:40px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:80px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:120px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:160px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:200px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:240px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:280px\"><\u002Fdiv>\n        <div class=\"tgcv-tick tgcv-tick--r\" style=\"left:400px;top:320px\"><\u002Fdiv>\n        <div class=\"tgcv-lbl tgcv-lbl--r\" style=\"left:408px;top:40px\">594<\u002Fdiv>\n        <div class=\"tgcv-lbl tgcv-lbl--r\" style=\"left:408px;top:320px\">0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin-top:8px\">\n      A1 square, 594 x 594 mm. Grid lines meet the sheet's corners exactly and carry on to the edge of the window.\n    <\u002Fp>\n\n    <h3 class=\"tg-sub\">Page &amp; sheet<\u002Fh3>\n    <div class=\"tg-sample\">\n      <dl class=\"tg-spec\">\n        <dt>Page<\u002Fdt><dd><code>--tg-bg<\u002Fcode> under the warm gradient, <code>overflow: hidden<\u002Fcode>, <code>100vw x 100vh<\u002Fcode> — the app never scrolls<\u002Fdd>\n        <dt>Sheet<\u002Fdt><dd>plain <code>#fff<\u002Fcode>, no border, no radius, no shadow. It is paper, not a card.<\u002Fdd>\n        <dt>Container<\u002Fdt><dd><code>position:absolute<\u002Fcode>, <code>inset: 0<\u002Fcode>, flex-centred, <code>overflow: hidden<\u002Fcode><\u002Fdd>\n        <dt>Zoom \u002F pan<\u002Fdt><dd><code>transform<\u002Fcode> on the canvas with <code>transform-origin: center center<\u002Fcode><\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">The grid is derived, not fixed<\u002Fh3>\n    <div class=\"tg-sample\">\n      <p style=\"font-size:12px;line-height:1.7;color:var(--tg-fg-2);margin:0 0 12px\">\n        The cell size is computed from the sheet each time it is drawn, so the grid always divides the paper into whole\n        units and its lines land exactly on the paper's edges. It then continues outward across the whole window in both\n        directions — the sheet sits <em>on<\u002Fem> the grid rather than next to it.\n      <\u002Fp>\n      <dl class=\"tg-spec\">\n        <dt>Divisions<\u002Fdt><dd><code>round(max(canvasW, canvasH) \u002F 60)<\u002Fcode>, clamped to <code>4…30<\u002Fcode><\u002Fdd>\n        <dt>Cell<\u002Fdt><dd><code>canvasW \u002F divisions<\u002Fcode> horizontally, <code>canvasH \u002F divisions<\u002Fcode> vertically — cells are not square unless the sheet is<\u002Fdd>\n        <dt>Line<\u002Fdt><dd><code>1px<\u002Fcode>, <code>#999<\u002Fcode> at <code>opacity 0.2<\u002Fcode>, drawn from the paper origin outward to both window edges<\u002Fdd>\n        <dt>Layer<\u002Fdt><dd><code>z-index 0<\u002Fcode>, <code>pointer-events: none<\u002Fcode> — behind everything, including the sheet<\u002Fdd>\n        <dt>Redraw<\u002Fdt><dd>on resize, zoom, and any paper-format change<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Rulers — the size readout<\u002Fh3>\n    <div class=\"tg-sample\">\n      <p style=\"font-size:12px;line-height:1.7;color:var(--tg-fg-2);margin:0 0 12px\">\n        Bottom and right edges only, so the readout never sits between the user and the artwork. Ticks mark every\n        division, but <strong style=\"color:var(--tg-fg)\">only the two ends are labelled<\u002Fstrong> — the sheet's size is the\n        useful number, not a full measuring tape.\n      <\u002Fp>\n      <dl class=\"tg-spec\">\n        <dt>Placement<\u002Fdt><dd>bottom ruler pinned to the sheet's bottom edge and matched to its width; right ruler to the right edge and its height<\u002Fdd>\n        <dt>Tick<\u002Fdt><dd><code>1 x 6px<\u002Fcode>, <code>--tg-fg-3<\u002Fcode> at <code>opacity 0.6<\u002Fcode>, one per division<\u002Fdd>\n        <dt>Guide line<\u002Fdt><dd><code>1px<\u002Fcode> <code>--tg-border<\u002Fcode> at <code>opacity 0.5<\u002Fcode>, spanning the ruler<\u002Fdd>\n        <dt>Label<\u002Fdt><dd><code>9px \u002F 400<\u002Fcode> Inter, <code>--tg-fg-3<\u002Fcode>, offset <code>8px<\u002Fcode> outward, centred on its tick<\u002Fdd>\n        <dt>Labelled ticks<\u002Fdt><dd>first and last only — <code>0<\u002Fcode> and the sheet dimension in mm<\u002Fdd>\n        <dt>Y direction<\u002Fdt><dd><strong style=\"color:var(--tg-fg)\">inverted<\u002Fstrong> — the right ruler reads <code>paperH - mm<\u002Fcode>, so <code>0<\u002Fcode> is at the bottom and the origin is bottom-left, as on a plotter bed<\u002Fdd>\n        <dt>Units<\u002Fdt><dd>millimetres, integer when within <code>0.05<\u002Fcode>, otherwise one decimal<\u002Fdd>\n        <dt>Layer<\u002Fdt><dd><code>z-index 50<\u002Fcode>, <code>pointer-events: none<\u002Fcode><\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       4. TYPOGRAPHY\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">04<\u002Fspan>\n      <h2>Typography<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tg-grid tg-grid-2\">\n      <div class=\"tg-type\">\n        <div class=\"tg-type-name\">Display \u002F H1<\u002Fdiv>\n        <div style=\"font-size:32px;font-weight:700;letter-spacing:-0.02em\">Targz Launchpad<\u002Fdiv>\n        <div class=\"tg-type-spec\">Inter · 700 · 32px · -2% tracking<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-type\">\n        <div class=\"tg-type-name\">Title<\u002Fdiv>\n        <div style=\"font-size:18px;font-weight:600\">Portrait-Voronoi<\u002Fdiv>\n        <div class=\"tg-type-spec\">Inter · 600 · 18px<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-type\">\n        <div class=\"tg-type-name\">Section eyebrow<\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--tg-fg-2)\">MODE &amp; PEN<\u002Fdiv>\n        <div class=\"tg-type-spec\">Inter · 600 · 11px · 12% tracking · UPPER<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-type\">\n        <div class=\"tg-type-name\">Body<\u002Fdiv>\n        <div style=\"font-size:14px\">Generative isometric hex depthmap for pen plotter — portrait encoding via Pilot Parallel Pen.<\u002Fdiv>\n        <div class=\"tg-type-spec\">Inter · 400 · 14px · 1.45 leading<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-type\">\n        <div class=\"tg-type-name\">Label \u002F row<\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--tg-fg-2)\">Hex Overlap<\u002Fdiv>\n        <div class=\"tg-type-spec\">Inter · 400 · 11px<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-type\">\n        <div class=\"tg-type-name\">Mono — coords \u002F logs<\u002Fdiv>\n        <div style=\"font-family:var(--tg-font-mono);font-size:13px\">X: 499.7162  Y: 266.6690  Z: −30.00<\u002Fdiv>\n        <div class=\"tg-type-spec\">JetBrains Mono · 400 · 13px<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       5. TOKENS — radii \u002F spacing \u002F shadows\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">05<\u002Fspan>\n      <h2>Radii, spacing &amp; shadows<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Radii<\u002Fh3>\n    <div class=\"tg-grid tg-grid-4\">\n      <div class=\"tg-token\"><div class=\"tg-token-vis\" style=\"border-radius:2px\"><\u002Fdiv><div class=\"tg-token-meta\"><div class=\"tg-token-name\">tight<\u002Fdiv><div class=\"tg-token-detail\">2px · field corners<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-token\"><div class=\"tg-token-vis\" style=\"border-radius:4px\"><\u002Fdiv><div class=\"tg-token-meta\"><div class=\"tg-token-name\">sm<\u002Fdiv><div class=\"tg-token-detail\">4px · --tg-r-sm<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-token\"><div class=\"tg-token-vis\" style=\"border-radius:8px\"><\u002Fdiv><div class=\"tg-token-meta\"><div class=\"tg-token-name\">md<\u002Fdiv><div class=\"tg-token-detail\">8px · --tg-r-md · cards<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"tg-token\"><div class=\"tg-token-vis\" style=\"border-radius:999px\"><\u002Fdiv><div class=\"tg-token-meta\"><div class=\"tg-token-name\">pill<\u002Fdiv><div class=\"tg-token-detail\">∞ · dock, segmented<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Spacing scale (4px base)<\u002Fh3>\n    <div class=\"tg-grid\" style=\"grid-template-columns:1fr;gap:6px\">\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:4px\"><\u002Fdiv><span class=\"tg-token-detail\">4 · 1u<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:8px\"><\u002Fdiv><span class=\"tg-token-detail\">8 · 2u<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:12px\"><\u002Fdiv><span class=\"tg-token-detail\">12 · 3u · row padding<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:16px\"><\u002Fdiv><span class=\"tg-token-detail\">16 · 4u · card padding<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:24px\"><\u002Fdiv><span class=\"tg-token-detail\">24 · 6u · section gap<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:32px\"><\u002Fdiv><span class=\"tg-token-detail\">32 · 8u · page gutter<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"><div class=\"tg-spacer\" style=\"width:64px\"><\u002Fdiv><span class=\"tg-token-detail\">64 · 16u · between sections<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Shadows<\u002Fh3>\n    <div class=\"tg-grid tg-grid-2\">\n      <div class=\"tg-token\" style=\"height:120px;justify-content:center\">\n        <div style=\"width:120px;height:60px;background:#fff;border:1px solid var(--tg-border);border-radius:8px;box-shadow:var(--tg-shadow-panel)\"><\u002Fdiv>\n        <div class=\"tg-token-meta\"><div class=\"tg-token-name\">panel<\u002Fdiv><div class=\"tg-token-detail\">0 1 2 \u002F .04, 0 8 24 \u002F .06<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-token\" style=\"height:120px;justify-content:center\">\n        <div style=\"width:160px;height:50px;background:#fff;border:1px solid var(--tg-border);border-radius:999px;box-shadow:var(--tg-shadow-pill)\"><\u002Fdiv>\n        <div class=\"tg-token-meta\"><div class=\"tg-token-name\">pill \u002F dock<\u002Fdiv><div class=\"tg-token-detail\">0 2 4 \u002F .04, 0 12 32 \u002F .10<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       6. SIDE PANEL (TWEAKPANE)\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">06<\u002Fspan>\n      <h2>Side panel<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"tg-sample\" style=\"border-left:3px solid var(--tg-orange);margin-bottom:18px\">\n      <h4 style=\"margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:-.01em\">\n        The side panel is <a href=\"https:\u002F\u002Ftweakpane.github.io\u002Fdocs\u002F\" style=\"color:var(--tg-orange)\">Tweakpane&nbsp;4<\u002Fa> — not a custom component\n      <\u002Fh4>\n      <p style=\"margin:0;font-size:12.5px;line-height:1.7;color:var(--tg-fg-2)\">\n        Every generative tool builds its right-hand (params) and left-hand (layers) panes with the\n        <code>tweakpane<\u002Fcode> npm package, then skins them through Tweakpane's own <code>--tp-*<\u002Fcode> CSS variables.\n        <strong style=\"color:var(--tg-fg)\">Do not hand-build this panel.<\u002Fstrong> Create a pane, paste the skin block below\n        onto the container, and everything here comes for free — the markup, the row layout, the sliders, the folder\n        collapsing and the drag handles are all Tweakpane's. This design system supplies the skin and the placement rules,\n        nothing more.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">How a skinned pane renders<\u002Fh3>\n    <div class=\"tg-stage tg-stage--two\" style=\"min-height:420px;align-items:flex-start;padding:28px 32px\">\n      <div class=\"tgtp\" style=\"width:270px\">\n        <div class=\"tgtp-bar\">Layers <span class=\"grip\">⣿<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-fold tgtp-fold--layer\">Layer A <span class=\"grip\">◑<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-body\">\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Min cell (mm)<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:14%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">20<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Max cell (mm)<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:52%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">120<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Jitter<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:85%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">0.85<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Hatch<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-ckb\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Hatch color<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-color\"><i><\u002Fi>#000000<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tgtp-fold tgtp-fold--layer\">Layer B <span class=\"grip\">◑<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-body\">\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Min cell (mm)<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:8%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">12<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Roundness<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:100%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">1.00<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"tgtp\">\n        <div class=\"tgtp-bar\">Portrait-Y <span class=\"grip\">⣿<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-fold\">Global <span class=\"grip\">◑<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-body\">\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">paperFormat<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-sel\">A3 <span>▾<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">orientation<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-sel\">Square <span>▾<\u002Fspan><\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Size (cm)<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:42%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">29.7<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Margin (mm)<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:0%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">0.0<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tgtp-fold\">Hex <span class=\"grip\">◑<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-body\">\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">hexSize<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:60%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">60<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Hex Count<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:40%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">80<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Hex Overlap<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:50%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">0.50<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Random Seed<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-track\"><i style=\"width:42%\"><\u002Fi><\u002Fspan><span class=\"tgtp-num\">42<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Show Hex Outlines<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-ckb\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tgtp-fold tgtp-fold--settings\">Pen Colors <span class=\"grip\">◑<\u002Fspan><\u002Fdiv>\n        <div class=\"tgtp-body\">\n          <div class=\"tgtp-row\"><span class=\"tgtp-lbl\">Pen<\u002Fspan><span class=\"tgtp-ctl\"><span class=\"tgtp-color\"><i><\u002Fi>#000000<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"tgtp-row\"><button class=\"tgtp-btn\">Add pen<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin-top:8px\">\n      Static reproduction. Geometry below is Tweakpane's own stylesheet resolved against the skin — check it if you ever need to sit a hand-built control next to a generated one.\n    <\u002Fp>\n\n    <h3 class=\"tg-sub\">Widget anatomy<\u002Fh3>\n    <div class=\"tg-sample\">\n      <dl class=\"tg-spec\">\n        <dt>Row height<\u002Fdt><dd><code>20px<\u002Fcode> — <code>--tp-container-unit-size<\u002Fcode><\u002Fdd>\n        <dt>Container padding<\u002Fdt><dd><code>4px<\u002Fcode> both axes — <code>--tp-container-*-padding<\u002Fcode><\u002Fdd>\n        <dt>Pane radius<\u002Fdt><dd><code>10px<\u002Fcode> — <code>--tp-base-border-radius<\u002Fcode> (Tweakpane defaults to 6)<\u002Fdd>\n        <dt>Blade radius<\u002Fdt><dd><code>2px<\u002Fcode> — <code>--tp-blade-border-radius<\u002Fcode><\u002Fdd>\n        <dt>Slider track<\u002Fdt><dd><code>2px<\u002Fcode> tall, inset <code>6px<\u002Fcode> — <code>--tp-input-background-color<\u002Fcode><\u002Fdd>\n        <dt>Slider fill<\u002Fdt><dd><code>2px<\u002Fcode> tall, <strong style=\"color:var(--tg-fg)\">near-black, not orange<\u002Fstrong> — <code>--tp-input-foreground-color<\u002Fcode><\u002Fdd>\n        <dt>Slider knob<\u002Fdt><dd><code>12 x 12px<\u002Fcode> square, radius <code>2px<\u002Fcode> — <code>--tp-button-background-color<\u002Fcode><\u002Fdd>\n        <dt>Knob states<\u002Fdt><dd>hover <code>hsl(24,100%,55%)<\u002Fcode>, active <code>42%<\u002Fcode>, focus <code>46%<\u002Fcode><\u002Fdd>\n        <dt>Value field<\u002Fdt><dd>right-aligned text on <code>--tp-input-background-color<\u002Fcode><\u002Fdd>\n        <dt>List \u002F select<\u002Fdt><dd>filled with the button colour — reads as an orange chip<\u002Fdd>\n        <dt>Label<\u002Fdt><dd><code>padding-right: 16px<\u002Fcode> and <code>hyphens: auto<\u002Fcode>, so long labels wrap to two lines — <code>--tp-label-foreground-color<\u002Fcode><\u002Fdd>\n        <dt>Folder strip<\u002Fdt><dd><code>--tp-container-background-color<\u002Fcode>; title bar is <code>cursor: grab<\u002Fcode>, panes are draggable<\u002Fdd>\n        <dt>Folder accent<\u002Fdt><dd><code>3px<\u002Fcode> left border, added by us — <code>.folder-global<\u002Fcode> orange, <code>.folder-settings<\u002Fcode> green, <code>.folder-layer<\u002Fcode> blue<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Placement<\u002Fh3>\n    <div class=\"tg-sample\">\n      <dl class=\"tg-spec\">\n        <dt>Right pane (params)<\u002Fdt><dd><code>fixed<\u002Fcode>, top \u002F right <code>20px<\u002Fcode>, width <code>280px<\u002Fcode><\u002Fdd>\n        <dt>Left pane (layers)<\u002Fdt><dd><code>fixed<\u002Fcode>, top \u002F left <code>20px<\u002Fcode>, width <code>260px<\u002Fcode><\u002Fdd>\n        <dt>Sub-page pane<\u002Fdt><dd><code>fixed<\u002Fcode>, top <code>70px<\u002Fcode>, right <code>16px<\u002Fcode>, width <code>300px<\u002Fcode>, <code>z-index 120<\u002Fcode><\u002Fdd>\n        <dt>Height<\u002Fdt><dd><code>max-height: calc(100vh - 100px)<\u002Fcode> with <code>overflow-y: auto<\u002Fcode><\u002Fdd>\n        <dt>Elevation<\u002Fdt><dd><code>--tg-shadow-panel<\u002Fcode><\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">The skin — paste onto every pane container<\u002Fh3>\n    <div class=\"tg-console\" style=\"max-height:none\">\n      <div>--tp-base-background-color: hsla(0, 0%, 100%, 1.0);<\u002Fdiv>\n      <div>--tp-base-shadow-color: hsla(0, 0%, 0%, 0.08);<\u002Fdiv>\n      <div>--tp-base-border-radius: 10px;<\u002Fdiv>\n      <div>--tp-base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;<\u002Fdiv>\n      <div>--tp-button-background-color: hsla(24, 100%, 50%, 1.0);<\u002Fdiv>\n      <div>--tp-button-background-color-active: hsla(24, 100%, 42%, 1.0);<\u002Fdiv>\n      <div>--tp-button-background-color-focus: hsla(24, 100%, 46%, 1.0);<\u002Fdiv>\n      <div>--tp-button-background-color-hover: hsla(24, 100%, 55%, 1.0);<\u002Fdiv>\n      <div>--tp-button-foreground-color: hsla(0, 0%, 100%, 1.0);<\u002Fdiv>\n      <div>--tp-container-background-color: hsla(30, 10%, 97%, 1.0);<\u002Fdiv>\n      <div>--tp-container-background-color-active: hsla(30, 10%, 90%, 1.0);<\u002Fdiv>\n      <div>--tp-container-background-color-focus: hsla(30, 10%, 93%, 1.0);<\u002Fdiv>\n      <div>--tp-container-background-color-hover: hsla(30, 10%, 95%, 1.0);<\u002Fdiv>\n      <div>--tp-container-foreground-color: hsla(0, 0%, 10%, 1.0);<\u002Fdiv>\n      <div>--tp-groove-foreground-color: hsla(24, 100%, 50%, 0.3);<\u002Fdiv>\n      <div>--tp-input-background-color: hsla(30, 8%, 92%, 1.0);<\u002Fdiv>\n      <div>--tp-input-background-color-active: hsla(30, 8%, 85%, 1.0);<\u002Fdiv>\n      <div>--tp-input-background-color-focus: hsla(30, 8%, 88%, 1.0);<\u002Fdiv>\n      <div>--tp-input-background-color-hover: hsla(30, 8%, 90%, 1.0);<\u002Fdiv>\n      <div>--tp-input-foreground-color: hsla(0, 0%, 10%, 1.0);<\u002Fdiv>\n      <div>--tp-label-foreground-color: hsla(0, 0%, 42%, 1.0);<\u002Fdiv>\n      <div>--tp-monitor-background-color: hsla(30, 8%, 92%, 1.0);<\u002Fdiv>\n      <div>--tp-monitor-foreground-color: hsla(0, 0%, 42%, 1.0);<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin-top:8px\">\n      Put this in one class and apply it to every pane container rather than repeating it — it is currently pasted up to four times per file, and the copies have already begun to drift.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       7. NAV BAR (bottom dock)\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">07<\u002Fspan>\n      <h2>Nav bar<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin:-8px 0 16px\">\n      Frosted glass pill, centered at the bottom, floating over the canvas. Holds tool actions, a menu per action, and a runtime readout.\n    <\u002Fp>\n\n    <div class=\"tg-stage\" style=\"min-height:280px;align-items:flex-end;padding-bottom:24px\">\n      <nav class=\"tg-navbar\">\n        <ul class=\"tg-navmenu\">\n          <li class=\"is-open\" title=\"File\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg>\n            <ul class=\"tg-navpop\">\n              <li><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z\"><\u002Fpath><polyline points=\"17 21 17 13 7 13 7 21\"><\u002Fpolyline><\u002Fsvg>Save Config<span class=\"tg-kbd\"><kbd>Ctrl<\u002Fkbd><kbd>S<\u002Fkbd><\u002Fspan><\u002Fli>\n              <li><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg>Load Config<span class=\"tg-kbd\"><kbd>Ctrl<\u002Fkbd><kbd>O<\u002Fkbd><\u002Fspan><\u002Fli>\n            <\u002Ful>\n          <\u002Fli>\n          <li title=\"Export\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"17 8 12 3 7 8\"><\u002Fpolyline><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"><\u002Fline><\u002Fsvg><\u002Fli>\n          <li class=\"is-on\" title=\"Image\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"><\u002Fcircle><polyline points=\"21 15 16 10 5 21\"><\u002Fpolyline><\u002Fsvg><\u002Fli>\n          <li class=\"tg-navsep\"><\u002Fli>\n          <li title=\"Zoom\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"><\u002Fline><\u002Fsvg><\u002Fli>\n          <li title=\"Settings\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"><\u002Fpath><\u002Fsvg><\u002Fli>\n          <li class=\"tg-navsep\"><\u002Fli>\n          <li title=\"Render\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"5 3 19 12 5 21 5 3\"><\u002Fpolygon><\u002Fsvg><\u002Fli>\n          <li class=\"tg-navstatus\">25.07 m<\u002Fli>\n        <\u002
