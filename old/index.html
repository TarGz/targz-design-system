Ful>\n      <\u002Fnav>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Spec<\u002Fh3>\n    <div class=\"tg-sample\">\n      <dl class=\"tg-spec\">\n        <dt>Position<\u002Fdt><dd><code>fixed<\u002Fcode>, bottom <code>20px<\u002Fcode>, centered with <code>left:50%<\u002Fcode> + <code>translateX(-50%)<\u002Fcode><\u002Fdd>\n        <dt>Container<\u002Fdt><dd>glass <code>hsla(0,0%,92%,.8)<\u002Fcode> + <code>blur(20px)<\u002Fcode>, <code>1px<\u002Fcode> white-50% edge, radius <code>18px<\u002Fcode>, padding <code>6px 10px<\u002Fcode><\u002Fdd>\n        <dt>Item<\u002Fdt><dd><code>40 x 40px<\u002Fcode>, radius <code>12px<\u002Fcode>, icon <code>20px<\u002Fcode> at stroke <code>1.8<\u002Fcode><\u002Fdd>\n        <dt>Hover \u002F open<\u002Fdt><dd>background <code>hsla(0,0%,100%,.7)<\u002Fcode>, icon to <code>--tg-fg<\u002Fcode><\u002Fdd>\n        <dt>Active<\u002Fdt><dd>icon to <code>--tg-orange<\u002Fcode>, no background chip<\u002Fdd>\n        <dt>Separator<\u002Fdt><dd><code>1px x 24px<\u002Fcode> at <code>hsla(0,0%,0%,.10)<\u002Fcode>, margin <code>0 4px<\u002Fcode>, no hover<\u002Fdd>\n        <dt>Status<\u002Fdt><dd>auto width, <code>11px \u002F 500<\u002Fcode>, <code>--tg-fg-3<\u002Fcode>, not interactive<\u002Fdd>\n        <dt>Menu<\u002Fdt><dd>opens upward <code>14px<\u002Fcode> above, min-width <code>220px<\u002Fcode>, radius <code>14px<\u002Fcode>, <code>12px<\u002Fcode> rotated arrow<\u002Fdd>\n        <dt>Shortcut<\u002Fdt><dd><code>kbd<\u002Fcode> in Inter <code>11px<\u002Fcode> on <code>hsla(0,0%,0%,.06)<\u002Fcode>, radius <code>4px<\u002Fcode><\u002Fdd>\n        <dt>Busy<\u002Fdt><dd>render icon spins, <code>1s linear infinite<\u002Fcode><\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       8. BUTTONS \u002F TAGS \u002F SEGMENTED\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">08<\u002Fspan>\n      <h2>Buttons, tags &amp; segmented controls<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Buttons<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:100px;gap:12px;flex-wrap:wrap\">\n      <button class=\"tg-btn-primary\">VALIDATE<\u002Fbutton>\n      <button class=\"tg-btn tg-btn--launch\"><span class=\"dot\"><\u002Fspan>Launch<\u002Fbutton>\n      <button class=\"tg-btn tg-btn--stop\"><span class=\"dot\"><\u002Fspan>Stop<\u002Fbutton>\n      <button class=\"tg-btn\">&lt;\u002F&gt; VS Code<\u002Fbutton>\n      <button class=\"tg-btn\">⌘ Refresh<\u002Fbutton>\n      <button class=\"tg-btn tg-btn--dark\">⏻ Stop All<\u002Fbutton>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Segmented (dark pill)<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:80px\">\n      <div class=\"tg-segment\">\n        <button class=\"is-on\">Favorites <span class=\"count\">9<\u002Fspan><\u002Fbutton>\n        <button>All <span class=\"count\">24<\u002Fspan><\u002Fbutton>\n        <button>Hidden <span class=\"count\">0<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Tags<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:80px;gap:8px;flex-wrap:wrap\">\n      <span class=\"tg-tag tg-tag--node\">NODE<\u002Fspan>\n      <span class=\"tg-tag\">dev<\u002Fspan>\n      <span class=\"tg-tag\">build<\u002Fspan>\n      <span class=\"tg-tag\">start<\u002Fspan>\n      <span class=\"tg-tag\">preview<\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Status &amp; Port<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:80px;gap:24px\">\n      <span class=\"tg-status\"><span class=\"dot\"><\u002Fspan>Running<\u002Fspan>\n      <span class=\"tg-status is-off\"><span class=\"dot\"><\u002Fspan>Idle<\u002Fspan>\n      <div class=\"tg-port\" style=\"width:280px\">\n        <span>↗  localhost:3000<\u002Fspan>\n        <span class=\"open\">Open in browser<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       9. PROJECT CARD\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">09<\u002Fspan>\n      <h2>Project Card<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tg-stage tg-stage--tall\" style=\"align-items:flex-start\">\n      <div class=\"tg-grid tg-grid-3\" style=\"width:100%\">\n        <div class=\"tg-card tg-card--running\">\n          <div class=\"tg-card-head\">\n            <div class=\"tg-card-title\"><span class=\"scope\">_divers\u002F<\u002Fspan><span>MUSIC_SYNC<\u002Fspan><span class=\"star\">★<\u002Fspan><\u002Fdiv>\n            <span class=\"tg-tag tg-tag--node\">NODE<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"tg-card-desc\">kDrive music browser — transcodes albums + writes .m3u8 playlists for Music.app to sync to iPod<\u002Fp>\n          <div class=\"tg-port\"><span>↗  localhost:3000<\u002Fspan><span class=\"open\">Open in browser<\u002Fspan><\u002Fdiv>\n          <div class=\"tg-card-row\">\n            <button class=\"tg-btn tg-btn--stop\"><span class=\"dot\"><\u002Fspan>Stop<\u002Fbutton>\n            <button class=\"tg-btn\">&lt;\u002F&gt; VS Code<\u002Fbutton>\n            <button class=\"tg-btn\">📁 Finder<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"tg-card-tags\"><span class=\"tg-tag\">dev<\u002Fspan><span class=\"tg-tag\">start<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"tg-card\">\n          <div class=\"tg-card-head\">\n            <div class=\"tg-card-title\"><span>BlendedSquareV4<\u002Fspan><span class=\"star\">★<\u002Fspan><\u002Fdiv>\n            <span class=\"tg-tag tg-tag--node\">NODE<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"tg-card-desc\">BlendedSquare V4 - Independent generative art platform with custom parameter system<\u002Fp>\n          <div class=\"tg-card-row\">\n            <button class=\"tg-btn tg-btn--launch\"><span class=\"dot\"><\u002Fspan>▶ Launch<\u002Fbutton>\n            <button class=\"tg-btn\">&lt;\u002F&gt; VS Code<\u002Fbutton>\n            <button class=\"tg-btn\">📁 Finder<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"tg-card-tags\"><span class=\"tg-tag\">dev<\u002Fspan><span class=\"tg-tag\">build<\u002Fspan><span class=\"tg-tag\">start<\u002Fspan><span class=\"tg-tag\">preview<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"tg-card\">\n          <div class=\"tg-card-head\">\n            <div class=\"tg-card-title\"><span>Portrait-Cubes<\u002Fspan><span class=\"star\">★<\u002Fspan><\u002Fdiv>\n            <span class=\"tg-tag tg-tag--node\">NODE<\u002Fspan>\n          <\u002Fdiv>\n          <p class=\"tg-card-desc\">Generative isometric cube grid with hatching for pen plotter — portrait encoding via grayscale density<\u002Fp>\n          <div class=\"tg-card-row\">\n            <button class=\"tg-btn tg-btn--launch\"><span class=\"dot\"><\u002Fspan>▶ Launch<\u002Fbutton>\n            <button class=\"tg-btn\">&lt;\u002F&gt; VS Code<\u002Fbutton>\n            <button class=\"tg-btn\">📁 Finder<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"tg-card-tags\"><span class=\"tg-tag\">dev<\u002Fspan><span class=\"tg-tag\">start<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       10. LOG \u002F CONSOLE\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">10<\u002Fspan>\n      <h2>Logs &amp; console<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin:-8px 0 16px\">\n      The log is an event, not a surface. A parked log card holds a 350px column for the 99% of the session when it has nothing new to say. Three states instead — silent, a transient toast, and an on-demand history in the nav bar.\n    <\u002Fp>\n\n    <h3 class=\"tg-sub\">1 — Silent<\u002Fh3>\n    <div class=\"tg-sample\">\n      <p style=\"font-size:12px;line-height:1.6;color:var(--tg-fg-2);margin:0\">\n        The default, and where the interface sits almost all the time. Nothing on screen. The only permanent readout worth the space is the plot length, and it already lives in the nav bar status slot.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">2 — Toast<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:200px;flex-direction:column;gap:10px\">\n      <div class=\"tg-toast\"><i><\u002Fi><span>photo: default-portrait.png (1410x1410)<\u002Fspan><\u002Fdiv>\n      <div class=\"tg-toast tg-toast--ok\"><i><\u002Fi><span>rendered 40 ribbons &middot; 24.8 m in 1.9s<\u002Fspan><\u002Fdiv>\n      <div class=\"tg-toast tg-toast--warn\"><i><\u002Fi><span>render first (Space), then open Shading<\u002Fspan><span class=\"rep\">&times;3<\u002Fspan><\u002Fdiv>\n      <div class=\"tg-toast tg-toast--err\"><i><\u002Fi><span>SVG export failed — no paths on canvas<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin-top:8px\">\n      Centered 84px above the bottom edge, clear of the nav bar. Stacks upward, max 3. The repeat chip is what turns three identical “render first” lines into one.\n    <\u002Fp>\n\n    <h3 class=\"tg-sub\">3 — History<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:260px;align-items:flex-end;padding-bottom:24px;flex-direction:column;justify-content:flex-end;gap:14px\">\n      <div class=\"tg-loghist\">\n        <div class=\"row\"><span class=\"ts\">16:54:39<\u002Fspan><span>Portrait-Y initialized<\u002Fspan><\u002Fdiv>\n        <div class=\"row\"><span class=\"ts\">16:54:39<\u002Fspan><span>white points: 701 — triangulating…<\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"color:var(--tg-orange)\"><span class=\"ts\">16:54:41<\u002Fspan><span>render first (Space), then open Shading<\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"color:var(--tg-red)\"><span class=\"ts\">16:54:44<\u002Fspan><span>SVG export failed — no paths on canvas<\u002Fspan><\u002Fdiv>\n        <div class=\"row\" style=\"color:var(--tg-green)\"><span class=\"ts\">16:54:52<\u002Fspan><span>done — 296.38 m<\u002Fspan><\u002Fdiv>\n        <div class=\"foot\"><span>5 entries<\u002Fspan><span style=\"color:var(--tg-fg-2)\">Clear<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <nav class=\"tg-navbar\">\n        <ul class=\"tg-navmenu\">\n          <li title=\"File\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg><\u002Fli>\n          <li class=\"tg-navsep\"><\u002Fli>\n          <li class=\"tg-unread\" title=\"Log\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 17 10 11 4 5\"><\u002Fpolyline><line x1=\"12\" y1=\"19\" x2=\"20\" y2=\"19\"><\u002Fline><\u002Fsvg><\u002Fli>\n          <li title=\"Render\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"5 3 19 12 5 21 5 3\"><\u002Fpolygon><\u002Fsvg><\u002Fli>\n          <li class=\"tg-navstatus\">25.07 m<\u002Fli>\n        <\u002Ful>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin-top:8px\">\n      One nav bar item opens the full history as a menu — the same popover the File and Export actions use. Resting cost is 40x40px of chrome that was already allocated.\n    <\u002Fp>\n\n    <h3 class=\"tg-sub\">Rules<\u002Fh3>\n    <div class=\"tg-sample\">\n      <dl class=\"tg-spec\">\n        <dt>Dwell<\u002Fdt><dd><code>info<\u002Fcode> \u002F <code>success<\u002Fcode> 3.5s &middot; <code>warning<\u002Fcode> 6s &middot; <code>error<\u002Fcode> sticky until dismissed. All levels land in the history regardless.<\u002Fdd>\n        <dt>Repeats<\u002Fdt><dd>An identical consecutive message never stacks a second toast — it increments a <code>&times;N<\u002Fcode> chip and resets the timer.<\u002Fdd>\n        <dt>Unread<\u002Fdt><dd>Warnings and errors arriving while the history is shut put a <code>6px<\u002Fcode> dot on the nav bar item, orange or red. Cleared on open.<\u002Fdd>\n        <dt>Errors<\u002Fdt><dd>Tinted <code>--tg-red-soft<\u002Fcode> and never auto-hide — a failed export must not vanish while the user looks elsewhere.<\u002Fdd>\n        <dt>Never toast<\u002Fdt><dd>Progress and steady-state values. Those belong in the status slot or the render overlay.<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Console — long-running process output<\u002Fh3>\n    <div class=\"tg-stage\" style=\"min-height:200px;padding:24px\">\n      <div class=\"tg-console\" style=\"width:100%;max-height:200px\">\n        <div class=\"head\"><span class=\"dot\"><\u002Fspan>Running...<\u002Fdiv>\n        <div class=\"cmd\">vpype --config \u002Fvar\u002Ffolders\u002Ftt\u002Fpqkh78t138j78dw3hfy8_lm00000gp\u002FT\u002Fvpype-studio-1777473287715-gezmod.config read --no-crop<\u002Fdiv>\n        <div>'\u002FUsers\u002Fjterraz\u002FkDrive\u002FWORK_LONG_FORM\u002F06.Portrait2\u002F08.Mathildas\u002F08 Frieda Robscheit-Robbins \u002FPortrait-layers\u002FV6\u002FPortrait-layers_layers_2026-04-29T07-03-40.svg' linemerge --tolerance 0.1mm linesimplify --tolerance 0.5mm linesort --two-opt --no-flip start<\u002Fdiv>\n        <div>forlayer gwrite -p megaplot_with_pump %_lid%_%_name%_motor_pump_Portrait-layers_layers_2026-04-29T07-03-40_portrait_sort_no-flip_merge_split-.gcode show end<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"tg-sample-label\" style=\"margin-top:8px\">\n      Separate from the log. Use only for streamed output from an external process — vpype, a plotter driver — where the user needs the raw text.\n    <\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       11. TAB BAR \u002F APP HEADER\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">11<\u002Fspan>\n      <h2>Tab bar &amp; app header<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Tab bar — white pill, top centre<\u002Fh3>\n    <p class=\"tg-sample-label\" style=\"margin:-4px 0 14px\">\n      The page switcher. Opaque white, floating at the top of the canvas, above every other layer so it stays reachable — even while a render is running.\n    <\u002Fp>\n    <div class=\"tg-stage\" style=\"min-height:150px;align-items:flex-start\">\n      <div class=\"tg-tabs\">\n        <button class=\"is-on\">Canvas<\u002Fbutton>\n        <button>Photo<\u002Fbutton>\n        <button>Direction<\u002Fbutton>\n        <button>Border<\u002Fbutton>\n        <button>Shading<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Spec<\u002Fh3>\n    <div class=\"tg-sample\">\n      <dl class=\"tg-spec\">\n        <dt>Position<\u002Fdt><dd><code>fixed<\u002Fcode>, top <code>14px<\u002Fcode>, centered with <code>left:50%<\u002Fcode> + <code>translateX(-50%)<\u002Fcode>, <code>z-index 300<\u002Fcode> — the top layer<\u002Fdd>\n        <dt>Container<\u002Fdt><dd><code>--tg-surface<\u002Fcode> on <code>--tg-border<\u002Fcode>, radius <code>--tg-r-pill<\u002Fcode>, padding <code>4px<\u002Fcode>, gap <code>2px<\u002Fcode><\u002Fdd>\n        <dt>Tab<\u002Fdt><dd><code>7px 20px<\u002Fcode>, radius <code>--tg-r-pill<\u002Fcode>, <code>13px \u002F 600<\u002Fcode>, <code>--tg-fg-2<\u002Fcode><\u002Fdd>\n        <dt>Hover<\u002Fdt><dd><code>hsla(0,0%,0%,.04)<\u002Fcode>, label to <code>--tg-fg<\u002Fcode><\u002Fdd>\n        <dt>Active<\u002Fdt><dd><code>--tg-orange-soft<\u002Fcode> fill + <code>--tg-orange<\u002Fcode> label<\u002Fdd>\n        <dt>Focus<\u002Fdt><dd>a <code>3px<\u002Fcode> orange halo — never the browser default. No app currently ships any focus style at all.<\u002Fdd>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Material rule<\u002Fh3>\n    <div class=\"tg-sample\">\n      <p style=\"font-size:12px;line-height:1.6;color:var(--tg-fg-2);margin:0\">\n        <strong style=\"color:var(--tg-fg)\">Opaque white navigates, glass operates.<\u002Fstrong> A bar that answers “which page am I on” is solid — it is a fixed landmark and should not shimmer with whatever scrolls beneath it. A bar that holds tools, like the nav bar in section 07, is glass, because it floats over artwork the user is judging and must not claim to be part of it.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">App header — for windowed tools<\u002Fh3>\n    <p class=\"tg-sample-label\" style=\"margin:-4px 0 14px\">\n      Used where the app is a document window rather than a canvas: docked to the top edge, full width, underline tabs.\n    <\u002Fp>\n    <div class=\"tg-stage\" style=\"min-height:120px;padding:0;align-items:stretch\">\n      <div style=\"width:100%;padding:14px 20px;background:#fff;border-bottom:1px solid var(--tg-border);display:flex;align-items:center;gap:18px;border-radius:var(--tg-r-md)\">\n        <div style=\"display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:0.04em\">\n          <span style=\"width:18px;height:18px;background:var(--tg-orange);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px\">P<\u002Fspan>\n          <span style=\"text-transform:uppercase;font-size:13px\">Penplotter<\u002Fspan>\n          <span style=\"color:var(--tg-fg-3);text-transform:uppercase;font-size:11px;font-weight:600;letter-spacing:0.08em\">CONTROL<\u002Fspan>\n          <span style=\"font-family:var(--tg-font-mono);font-size:10px;color:var(--tg-fg-3);background:var(--tg-surface-3);padding:2px 6px;border-radius:999px\">v1.8.0<\u002Fspan>\n        <\u002Fdiv>\n        <nav style=\"display:flex;gap:0;align-items:center;height:32px\">\n          <a style=\"padding:0 14px;height:32px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--tg-orange);border-bottom:2px solid var(--tg-orange)\">Machine Control<\u002Fa>\n          <a style=\"padding:0 14px;height:32px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--tg-fg-3)\">Settings<\u002Fa>\n        <\u002Fnav>\n        <div style=\"flex:1\"><\u002Fdiv>\n        <span class=\"tg-status is-off\"><span class=\"dot\"><\u002Fspan>OFFLINE<\u002Fspan>\n        <button class=\"tg-btn-primary\">CONNECT<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       12. USAGE \u002F DO + DON'T\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">12<\u002Fspan>\n      <h2>Usage<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tg-grid tg-grid-2\">\n      <div class=\"tg-principle\">\n        <div class=\"num\" style=\"color:var(--tg-green)\">DO<\u002Fdiv>\n        <h4>Reserve orange for one thing per surface<\u002Fh4>\n        <p>The active tab, the primary CTA, the active dock icon — never all three. Pick the one that earns it on this screen.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\" style=\"color:var(--tg-red)\">DON'T<\u002Fdiv>\n        <h4>Stack accent on accent<\u002Fh4>\n        <p>Orange button next to orange tab next to orange status badge reads as noise. Demote secondary actions to ghost or text-only.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\" style=\"color:var(--tg-green)\">DO<\u002Fdiv>\n        <h4>Let monospace carry data<\u002Fh4>\n        <p>Coordinates, tolerances, paths, log timestamps, version chips — all monospace. Sans is for human-readable labels and copy.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\" style=\"color:var(--tg-red)\">DON'T<\u002Fdiv>\n        <h4>Trade the warm grid for white<\u002Fh4>\n        <p>The cream canvas + grid is the brand. Pure-white backgrounds belong to the canvas of the artwork itself, not the chrome around it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <p style=\"margin-top:80px;font-family:var(--tg-font-mono);font-size:10px;color:var(--tg-fg-3);text-align:center\">\n    targz — v1.0.0 · 6 surfaces studied · 1 system\n  <\u002Fp>\n<\u002Fmain>\n\n\n\n\n<script>\n\u002F* Contents rail — built from the sections, so a new section needs no edit here. *\u002F\n(function () {\n  var list = document.getElementById('tg-toc-list');\n  var links = new Map();\n  document.querySelectorAll('main > section.tg-section').forEach(function (sec) {\n    var num = sec.querySelector('.tg-num'), h2 = sec.querySelector('h2');\n    if (!num || !h2) return;\n    sec.id = 's' + num.textContent.trim();\n    var a = document.createElement('a');\n    a.href = '#' + sec.id;\n    var n = document.createElement('span'); n.className = 'n'; n.textContent = num.textContent.trim();\n    var t = document.createElement('span'); t.textContent = h2.textContent;\n    a.appendChild(n); a.appendChild(t);\n    list.appendChild(a);\n    links.set(sec, a);\n  });\n  var seen = new Map();\n  var io = new IntersectionObserver(function (entries) {\n    entries.forEach(function (e) { seen.set(e.target, e); });\n    var best = null;\n    seen.forEach(function (e) {\n      if (!e.isIntersecting) return;\n      if (!best || e.boundingClientRect.top < best.boundingClientRect.top) best = e;\n    });\n    if (!best) return;\n    links.forEach(function (a) { a.classList.remove('is-on'); });\n    var a = links.get(best.target);\n    if (!a) return;\n    a.classList.add('is-on');\n    var r = a.getBoundingClientRect(), c = list.getBoundingClientRect();\n    if (r.top < c.top || r.bottom > c.bottom) a.scrollIntoView({ block: 'nearest' });\n  }, { rootMargin: '0px 0px -66% 0px', threshold: 0 });\n  links.forEach(function (_, sec) { io.observe(sec); });\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
