<!-- The menu-bar glyph for Pen Plotter Control: the app icon's mark, REDRAWN for 36 pixels.

     It is not the icon scaled down. At this size the gaps inside the mark land
     under a pixel, so a straight reduction merges the parts and drops the thin
     ones off entirely. A tray glyph is the same IDEA at a size where only
     three or four strokes fit.

     Black with alpha, because macOS treats a menu-bar image as a template and
     inverts it for the dark bar - any colour in here is thrown away.

     `tray.png` is built from this file - see targz-design-system/docs/APP-ICONS.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <g fill="#000000">
    <rect x="11" y="6.5" width="14" height="6" rx="1.6"/>
    <path d="M13.6 15.4 L22.4 15.4 L20.6 20 L15.4 20 Z"/>
    <path d="M15.4 22.6 L20.6 22.6 C20.6 26.4 19.3 29.2 18 30.8 C16.7 29.2 15.4 26.4 15.4 22.6 Z"/>
  </g>
</svg>
