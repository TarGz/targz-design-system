<!-- Targz Launchpad - the app icon.
     Built to targz-design-system/docs/APP-ICONS.md.

     ONE PLATE FOR ALL THREE APPS. The hue is not what tells them apart - the
     mark is. Three steps of one family read as three near-misses of the same
     colour at dock size; one plate reads as a suite, and then the drawing has
     to do its own work. The ramp is Terminass's, which was right first.

     THE MARK IS THE ORIGINAL, TRACED - not redrawn by eye. Three attempts at
     copying it from the PNG produced three worse drawings; `potrace` over the
     shipped icon gives the real outline, so the sheets keep the exact weights
     and angles they always had. The transform is potrace's own flip, then a
     half to land in this canvas.

     `-t 12000` IS NOT OPTIONAL. Without a speckle threshold the trace also
     picks up the plate's own rim - the white hairline at a fifth - as a
     scatter of thin arcs around the corners, which doubles the path and puts
     white specks on the plate. The sheets are thousands of times that area,
     so nothing real is at risk.

     The PNG and the .icns are built FROM this file, see the doc. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse"
                    x1="100" y1="100" x2="924" y2="924">
      <stop offset="0" stop-color="#ffda6b"/>
      <stop offset="1" stop-color="#de920d"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4"
        fill="url(#g)" filter="url(#s)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4"
        fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="4"/>
