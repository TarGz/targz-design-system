  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>targz Design System<\u002Ftitle>\n\n\n\n<style>\n  :root {\n    /* === CORE SURFACES === */\n    --tg-bg:        #FDF1E8;        /* warm cream canvas */\n    --tg-bg-grid:   #EADFCE;        /* grid line on canvas */\n    --tg-surface:   #FFFFFF;        /* panel / card */\n    --tg-surface-2: #F8F1E6;        /* sunken / muted row */\n    --tg-surface-3: #F4EADD;        /* panel header strip */\n    --tg-surface-dark: #1a1a1a;     /* dark pill / console */\n    --tg-surface-dark-2: #0d0d0d;   /* console bg */\n\n    /* === BORDERS === */\n    --tg-border:    #EADFCE;        /* hairline on panels */\n    --tg-border-2:  #E0D2BD;        /* stronger divider */\n    --tg-border-dark: #2a2a2a;\n\n    /* === TEXT === */\n    --tg-fg:        #1a1a1a;\n    --tg-fg-2:      #4a4a4a;\n    --tg-fg-3:      #8a8275;       /* warm muted */\n    --tg-fg-on-dark: #f5f5f5;\n\n    /* === BRAND / STATE === */\n    --tg-orange:        #F26B1F;   /* PRIMARY — action / active / sliders */\n    --tg-orange-hover:  #DD5E14;\n    --tg-orange-soft:   #FCE5D2;   /* ghost bg */\n    --tg-green:         #16A34A;   /* running / launch / success */\n    --tg-green-soft:    #DCFCE7;\n    --tg-red:           #EF4444;   /* stop / error */\n    --tg-red-soft:      #FEE2E2;\n    --tg-blue:          #2563EB;   /* link / port */\n    --tg-blue-soft:     #DBEAFE;\n\n    /* === TYPE === */\n    --tg-font-sans: \"Inter\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    --tg-font-mono: \"JetBrains Mono\", \"SF Mono\", \"Menlo\", \"Consolas\", monospace;\n\n    /* === RADII === */\n    --tg-r-sm: 4px;\n    --tg-r-md: 8px;\n    --tg-r-lg: 14px;\n    --tg-r-pill: 999px;\n\n    /* === SHADOWS === */\n    --tg-shadow-panel: 0 1px 2px rgba(60,40,20,.04), 0 8px 24px rgba(60,40,20,.06);\n    --tg-shadow-pill:  0 2px 4px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.10);\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: var(--tg-font-sans);\n    font-size: 14px;\n    color: var(--tg-fg);\n    background: var(--tg-bg);\n    /* the signature warm grid */\n    background-image:\n      linear-gradient(to right, var(--tg-bg-grid) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--tg-bg-grid) 1px, transparent 1px);\n    background-size: 40px 40px;\n    background-position: -1px -1px;\n    min-height: 100vh;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  /* ============================================================\n     LAYOUT — Page is a long vertical doc with sections\n     ============================================================ */\n  .tg-page {\n    max-width: 1280px;\n    margin: 0 auto;\n    padding: 56px 32px 160px;\n  }\n  .tg-doc-head {\n    display: flex; align-items: baseline; gap: 12px;\n    margin-bottom: 6px;\n  }\n  .tg-doc-head h1 {\n    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;\n    margin: 0;\n  }\n  .tg-doc-head .tg-version {\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-fg-3);\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    padding: 2px 8px;\n    border-radius: var(--tg-r-pill);\n  }\n  .tg-doc-sub {\n    color: var(--tg-fg-3);\n    font-size: 13px;\n    margin: 0 0 48px;\n  }\n\n  .tg-section { margin: 64px 0 0; }\n  .tg-section-head {\n    display: flex; align-items: center; gap: 10px;\n    margin-bottom: 20px;\n    padding-bottom: 12px;\n    border-bottom: 1px solid var(--tg-border-2);\n  }\n  .tg-section-head h2 {\n    font-size: 11px;\n    font-weight: 600;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--tg-fg-2);\n    margin: 0;\n  }\n  .tg-section-head .tg-rule {\n    flex: 1; height: 1px;\n  }\n  .tg-section-head .tg-num {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n  }\n  .tg-section h3.tg-sub {\n    font-size: 11px; font-weight: 600;\n    text-transform: uppercase; letter-spacing: 0.1em;\n    color: var(--tg-fg-3);\n    margin: 28px 0 12px;\n  }\n\n  /* GRID OF SAMPLES */\n  .tg-grid { display: grid; gap: 20px; }\n  .tg-grid-2 { grid-template-columns: repeat(2, 1fr); }\n  .tg-grid-3 { grid-template-columns: repeat(3, 1fr); }\n  .tg-grid-4 { grid-template-columns: repeat(4, 1fr); }\n  .tg-grid-6 { grid-template-columns: repeat(6, 1fr); }\n\n  /* ============================================================\n     SAMPLE / SPEC CARDS\n     ============================================================ */\n  .tg-sample {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 16px;\n    box-shadow: var(--tg-shadow-panel);\n  }\n  .tg-sample-label {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n  }\n\n  /* ============================================================\n     COLOR SWATCHES\n     ============================================================ */\n  .tg-swatch {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    overflow: hidden;\n  }\n  .tg-swatch-color { height: 80px; border-bottom: 1px solid var(--tg-border); }\n  .tg-swatch-meta { padding: 10px 12px; }\n  .tg-swatch-name {\n    font-size: 12px; font-weight: 600;\n    color: var(--tg-fg);\n  }\n  .tg-swatch-token {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n    margin-top: 2px;\n  }\n  .tg-swatch-hex {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-2);\n    margin-top: 1px;\n  }\n\n  /* ============================================================\n     SIDE PANEL (the signature right/left config panel)\n     ============================================================ */\n  .tg-panel {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md) var(--tg-r-md) 4px 4px;\n    box-shadow: var(--tg-shadow-panel);\n    overflow: hidden;\n    width: 320px;\n    font-size: 12px;\n  }\n  .tg-panel-titlebar {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 8px 12px;\n    background: var(--tg-surface-3);\n    border-bottom: 1px solid var(--tg-border);\n    font-weight: 600;\n    font-size: 12px;\n    color: var(--tg-fg);\n  }\n  .tg-panel-titlebar .tg-grip {\n    color: var(--tg-fg-3); font-family: var(--tg-font-mono);\n    font-size: 14px; line-height: 1; cursor: ns-resize;\n    user-select: none;\n  }\n  .tg-panel-section {\n    padding: 6px 0;\n    border-bottom: 1px solid var(--tg-border);\n  }\n  .tg-panel-section:last-child { border-bottom: 0; }\n  .tg-panel-section-head {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 6px 12px 6px 14px;\n    position: relative;\n    font-weight: 600;\n    font-size: 12px;\n    color: var(--tg-fg);\n  }\n  .tg-panel-section-head::before {\n    content:\"\"; position:absolute; left: 0; top: 4px; bottom: 4px;\n    width: 3px; background: var(--tg-orange); border-radius: 0 2px 2px 0;\n  }\n  .tg-panel-section-head .tg-collapse {\n    color: var(--tg-fg-3); font-family: var(--tg-font-mono);\n    font-size: 12px; line-height: 1;\n  }\n\n  .tg-row {\n    display: grid;\n    grid-template-columns: 96px 1fr 44px;\n    align-items: center;\n    gap: 10px;\n    padding: 5px 12px;\n    min-height: 26px;\n  }\n  .tg-row-label {\n    font-size: 11px;\n    color: var(--tg-fg-2);\n    line-height: 1.25;\n  }\n  .tg-row-num {\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-fg);\n    text-align: right;\n  }\n\n  /* SLIDER — orange pill thumb on hairline track */\n  .tg-slider {\n    -webkit-appearance: none; appearance: none;\n    width: 100%;\n    height: 14px;\n    background: transparent;\n  }\n  .tg-slider::-webkit-slider-runnable-track {\n    height: 1px; background: var(--tg-border-2);\n  }\n  .tg-slider::-moz-range-track {\n    height: 1px; background: var(--tg-border-2);\n  }\n  .tg-slider::-webkit-slider-thumb {\n    -webkit-appearance: none;\n    width: 12px; height: 12px;\n    background: var(--tg-orange);\n    border-radius: 2px;\n    margin-top: -6px;\n    cursor: pointer;\n    border: none;\n  }\n  .tg-slider::-moz-range-thumb {\n    width: 12px; height: 12px;\n    background: var(--tg-orange);\n    border-radius: 2px;\n    border: none;\n    cursor: pointer;\n  }\n\n  /* SELECT — orange filled when active */\n  .tg-select {\n    appearance: none; -webkit-appearance: none;\n    width: 100%;\n    height: 22px;\n    padding: 0 22px 0 8px;\n    background:\n      linear-gradient(45deg, transparent 50%, #fff 50%) calc(100% - 8px) 50% / 5px 5px no-repeat,\n      linear-gradient(135deg, #fff 50%, transparent 50%) calc(100% - 3px) 50% / 5px 5px no-repeat,\n      var(--tg-orange);\n    color: #fff;\n    font-family: var(--tg-font-sans);\n    font-size: 11px;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.04em;\n    border: none;\n    border-radius: 3px;\n    cursor: pointer;\n  }\n\n  /* CHECKBOX — minimal */\n  .tg-check {\n    width: 14px; height: 14px;\n    border: 1px solid var(--tg-border-2);\n    border-radius: 2px;\n    background: var(--tg-surface);\n    display: inline-flex; align-items: center; justify-content: center;\n    cursor: pointer;\n  }\n  .tg-check.is-on::after {\n    content:\"\"; width: 8px; height: 8px;\n    background: var(--tg-fg);\n    clip-path: polygon(14% 44%, 0% 60%, 40% 100%, 100% 18%, 84% 4%, 38% 60%);\n  }\n\n  /* TEXT INPUT-LIKE FIELD */\n  .tg-field {\n    height: 22px;\n    border: 1px solid var(--tg-border-2);\n    border-radius: 3px;\n    padding: 0 8px;\n    background: var(--tg-surface);\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-fg);\n    display: flex; align-items: center;\n  }\n  .tg-field--swatch { padding-left: 4px; gap: 6px; }\n  .tg-field--swatch .tg-swatch-dot {\n    width: 16px; height: 16px; border-radius: 2px;\n    border: 1px solid var(--tg-border-2);\n  }\n\n  /* ADD BUTTON / PRIMARY ROW BUTTON */\n  .tg-btn-primary {\n    display: inline-flex; align-items: center; justify-content: center;\n    gap: 6px;\n    height: 28px; padding: 0 14px;\n    background: var(--tg-orange); color: #fff;\n    border: none; border-radius: 3px;\n    font-family: var(--tg-font-sans);\n    font-size: 12px; font-weight: 700;\n    text-transform: uppercase; letter-spacing: 0.04em;\n    cursor: pointer;\n  }\n  .tg-btn-primary:hover { background: var(--tg-orange-hover); }\n  .tg-btn-primary--block { width: 100%; }\n\n  /* ============================================================\n     BUTTONS / TAGS / PILLS (from launchpad)\n     ============================================================ */\n  .tg-btn {\n    display: inline-flex; align-items: center; gap: 6px;\n    height: 30px; padding: 0 12px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border-2);\n    border-radius: 6px;\n    font: 500 12px var(--tg-font-sans);\n    color: var(--tg-fg);\n    cursor: pointer;\n  }\n  .tg-btn:hover { background: var(--tg-surface-3); }\n  .tg-btn--launch {\n    background: var(--tg-green-soft); color: #166534;\n    border-color: #BBF7D0;\n  }\n  .tg-btn--stop {\n    background: var(--tg-red-soft); color: #B91C1C;\n    border-color: #FECACA;\n  }\n  .tg-btn--dark {\n    background: var(--tg-surface-dark); color: #fff;\n    border-color: var(--tg-surface-dark);\n  }\n  .tg-btn--ghost { background: transparent; }\n  .tg-btn .dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: currentColor;\n  }\n\n  .tg-tag {\n    display: inline-flex; align-items: center;\n    height: 18px; padding: 0 8px;\n    border-radius: var(--tg-r-pill);\n    background: var(--tg-surface-3);\n    color: var(--tg-fg-3);\n    font: 500 10px var(--tg-font-sans);\n    text-transform: lowercase;\n    letter-spacing: 0.02em;\n  }\n  .tg-tag--node {\n    background: #F0FDF4; color: #15803D;\n    font-family: var(--tg-font-mono);\n    font-weight: 700; text-transform: uppercase;\n    letter-spacing: 0.06em;\n    height: 20px;\n  }\n\n  /* SEGMENTED TABS (Favorites / All / Hidden) */\n  .tg-segment {\n    display: inline-flex; align-items: center; gap: 4px;\n    padding: 4px;\n    background: var(--tg-surface-dark);\n    border-radius: var(--tg-r-pill);\n  }\n  .tg-segment > button {\n    border: none; background: transparent;\n    color: #d4d4d4;\n    height: 28px; padding: 0 14px;\n    border-radius: var(--tg-r-pill);\n    font: 600 12px var(--tg-font-sans);\n    cursor: pointer;\n    display: inline-flex; align-items: center; gap: 8px;\n  }\n  .tg-segment > button.is-on {\n    background: var(--tg-orange); color: #fff;\n  }\n  .tg-segment > button .count {\n    background: rgba(255,255,255,.18);\n    padding: 1px 6px; border-radius: var(--tg-r-pill);\n    font-size: 10px;\n  }\n  .tg-segment > button.is-on .count { background: rgba(0,0,0,.18); }\n\n  /* PORT PILL (localhost:3000 ...) */\n  .tg-port {\n    display: inline-flex; align-items: center; justify-content: space-between;\n    width: 100%;\n    height: 32px; padding: 0 10px;\n    background: var(--tg-blue-soft);\n    color: #1e40af;\n    border-radius: 6px;\n    font: 600 12px var(--tg-font-mono);\n  }\n  .tg-port .open {\n    color: var(--tg-blue);\n    font-family: var(--tg-font-sans);\n    font-weight: 500;\n    font-size: 11px;\n  }\n\n  /* STATUS DOT */\n  .tg-status {\n    display: inline-flex; align-items: center; gap: 6px;\n    font-size: 11px; color: var(--tg-fg-3);\n  }\n  .tg-status .dot {\n    width: 8px; height: 8px; border-radius: 50%;\n    background: var(--tg-green); box-shadow: 0 0 0 2px rgba(22,163,74,.18);\n  }\n  .tg-status.is-off .dot { background: #d1d5db; box-shadow: none; }\n\n  /* ============================================================\n     PROJECT CARD (launchpad)\n     ============================================================ */\n  .tg-card {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-left: 3px solid transparent;\n    border-radius: var(--tg-r-md);\n    padding: 16px;\n    box-shadow: var(--tg-shadow-panel);\n    display: flex; flex-direction: column; gap: 10px;\n  }\n  .tg-card--running { border-left-color: var(--tg-green); }\n  .tg-card-head {\n    display: flex; align-items: center; justify-content: space-between;\n  }\n  .tg-card-title {\n    font-size: 13px; font-weight: 600;\n    display: flex; align-items: center; gap: 6px;\n  }\n  .tg-card-title .scope { color: var(--tg-fg-3); font-weight: 500; }\n  .tg-card-title .star {\n    color: var(--tg-orange);\n  }\n  .tg-card-desc {\n    font-size: 12px; color: var(--tg-fg-2);\n    line-height: 1.4;\n  }\n  .tg-card-row { display: flex; align-items: center; gap: 8px; }\n  .tg-card-tags { display: flex; gap: 6px; flex-wrap: wrap; }\n\n  /* ============================================================\n     BOTTOM NAV (the floating dock)\n     ============================================================ */\n  .tg-dock {\n    display: inline-flex; align-items: center;\n    gap: 4px;\n    padding: 6px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-pill);\n    box-shadow: var(--tg-shadow-pill);\n  }\n  .tg-dock > button {\n    width: 36px; height: 36px;\n    border: none; background: transparent;\n    border-radius: 50%;\n    color: var(--tg-fg-2);\n    display: inline-flex; align-items: center; justify-content: center;\n    cursor: pointer;\n  }\n  .tg-dock > button:hover { background: var(--tg-surface-3); color: var(--tg-fg); }\n  .tg-dock > button.is-on {\n    background: var(--tg-orange-soft); color: var(--tg-orange);\n  }\n  .tg-dock > .tg-dock-meta {\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 0 14px 0 8px;\n    color: var(--tg-fg-2);\n    font: 500 12px var(--tg-font-mono);\n  }\n  .tg-dock > .tg-dock-meta .play {\n    width: 24px; height: 24px; border-radius: 50%;\n    background: var(--tg-fg); color: #fff;\n    display: inline-flex; align-items: center; justify-content: center;\n    font-size: 10px;\n  }\n  .tg-dock-divider {\n    width: 1px; height: 20px; background: var(--tg-border-2);\n    margin: 0 4px;\n  }\n\n  /* ============================================================\n     LOG / TOAST CARD (bottom-left console)\n     ============================================================ */\n  .tg-log {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 10px 14px;\n    max-width: 360px;\n    font: 11px/1.6 var(--tg-font-mono);\n    color: var(--tg-fg-2);\n    box-shadow: var(--tg-shadow-panel);\n  }\n  .tg-log .ts { color: var(--tg-fg-3); }\n  .tg-log .ok { color: var(--tg-green); }\n  .tg-log .warn { color: var(--tg-orange); }\n  .tg-log .err { color: var(--tg-red); }\n\n  /* CONSOLE BLOCK (dark) */\n  .tg-console {\n    background: var(--tg-surface-dark-2);\n    color: #ff5b3a;\n    border-radius: var(--tg-r-md);\n    padding: 12px 14px;\n    font: 11px/1.55 var(--tg-font-mono);\n    overflow: auto;\n  }\n  .tg-console .head {\n    color: #fff; margin-bottom: 8px;\n    display: flex; align-items: center; gap: 6px;\n    font-weight: 600;\n  }\n  .tg-console .head .dot {\n    width: 8px; height: 8px; border-radius: 50%;\n    background: var(--tg-green);\n  }\n\n  /* ============================================================\n     TYPE SAMPLES\n     ============================================================ */\n  .tg-type {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 24px;\n    display: flex; flex-direction: column; gap: 4px;\n  }\n  .tg-type-name {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    text-transform: uppercase;\n    color: var(--tg-fg-3);\n    letter-spacing: 0.06em;\n  }\n  .tg-type-spec {\n    font-family: var(--tg-font-mono);\n    font-size: 10px;\n    color: var(--tg-fg-3);\n  }\n\n  /* ============================================================\n     RADIUS / SHADOW / SPACING TOKENS\n     ============================================================ */\n  .tg-token {\n    display: flex; align-items: center; gap: 14px;\n    padding: 14px;\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n  }\n  .tg-token-vis { width: 64px; height: 64px; flex: none; background: var(--tg-surface-3); border: 1px solid var(--tg-border-2); }\n  .tg-token-meta { display: flex; flex-direction: column; gap: 2px; }\n  .tg-token-name { font-size: 12px; font-weight: 600; }\n  .tg-token-detail { font-family: var(--tg-font-mono); font-size: 10px; color: var(--tg-fg-3); }\n\n  .tg-spacer {\n    background: var(--tg-orange);\n    height: 16px;\n  }\n\n  /* ============================================================\n     PRINCIPLES TEXT\n     ============================================================ */\n  .tg-principle {\n    background: var(--tg-surface);\n    border: 1px solid var(--tg-border);\n    border-radius: var(--tg-r-md);\n    padding: 22px 24px;\n  }\n  .tg-principle .num {\n    font-family: var(--tg-font-mono);\n    font-size: 11px;\n    color: var(--tg-orange);\n    margin-bottom: 8px;\n  }\n  .tg-principle h4 {\n    margin: 0 0 6px;\n    font-size: 16px;\n    font-weight: 600;\n    letter-spacing: -0.01em;\n  }\n  .tg-principle p {\n    margin: 0;\n    font-size: 13px;\n    line-height: 1.5;\n    color: var(--tg-fg-2);\n  }\n\n  /* hide scroll on inset console */\n  .tg-console::-webkit-scrollbar { width: 6px; height: 6px; }\n  .tg-console::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }\n\n  /* ============================================================\n     STAGE — wraps live demos with a soft inset\n     ============================================================ */\n  .tg-stage {\n    background: var(--tg-bg);\n    background-image:\n      linear-gradient(to right, var(--tg-bg-grid) 1px, transparent 1px),\n      linear-gradient(to bottom, var(--tg-bg-grid) 1px, transparent 1px);\n    background-size: 28px 28px;\n    border: 1px solid var(--tg-border-2);\n    border-radius: var(--tg-r-md);\n    padding: 32px;\n    display: flex; align-items: center; justify-content: center;\n    min-height: 220px;\n    position: relative;\n  }\n  .tg-stage--tall { min-height: 360px; }\n  .tg-stage--two { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n\n<main class=\"tg-page\">\n\n  <!-- ===== HEADER ===== -->\n  <div class=\"tg-doc-head\">\n    <h1>targz Design System<\u002Fh1>\n    <span class=\"tg-version\">v1.0.0<\u002Fspan>\n  <\u002Fdiv>\n  <p class=\"tg-doc-sub\">Visual language extracted from Launchpad, Penplotter Control, Vpype Studio, Portrait-Y, Portrait-Voronoi, and Portrait-Layers.<\u002Fp>\n\n  <!-- ============================================================\n       1. PRINCIPLES\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">01<\u002Fspan>\n      <h2>Principles<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tg-grid tg-grid-3\">\n      <div class=\"tg-principle\">\n        <div class=\"num\">A<\u002Fdiv>\n        <h4>Warm paper, not cold UI<\u002Fh4>\n        <p>The canvas is a sheet of paper sitting on a drafting table. Cream background, faint ruled grid, hairline borders. Never gray-on-gray.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\">B<\u002Fdiv>\n        <h4>Orange is for action<\u002Fh4>\n        <p>One signature orange — used for active states, sliders, primary buttons, highlights. Everything else stays quiet so it stays loud.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"tg-principle\">\n        <div class=\"num\">C<\u002Fdiv>\n        <h4>Tools, not products<\u002Fh4>\n        <p>Dense panels, monospace coordinates, version chips, console output. The interface looks like a workshop, because that's what it is.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============================================================\n       2. COLOR\n       ============================================================ -->\n  <section class=\"tg-section\">\n    <div class=\"tg-section-head\">\n      <span class=\"tg-num\">02<\u002Fspan>\n      <h2>Color<\u002Fh2>\n      <span class=\"tg-rule\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Surfaces<\u002Fh3>\n    <div class=\"tg-grid tg-grid-4\">\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#FDF1E8\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Canvas<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-bg<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#FDF1E8<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#FFFFFF;border-bottom-color:#EADFCE\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Surface<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-surface<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#FFFFFF<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#F4EADD\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Header strip<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-surface-3<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#F4EADD<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#1a1a1a\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Surface dark<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-surface-dark<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#1A1A1A<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"tg-sub\">Brand &amp; State<\u002Fh3>\n    <div class=\"tg-grid tg-grid-4\">\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#F26B1F\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Orange — primary<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-orange<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#F26B1F<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#16A34A\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Green — running<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-green<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#16A34A<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#EF4444\"><\u002Fdiv>\n        <div class=\"tg-swatch-meta\">\n          <div class=\"tg-swatch-name\">Red — stop<\u002Fdiv>\n          <div class=\"tg-swatch-token\">--tg-red<\u002Fdiv>\n          <div class=\"tg-swatch-hex\">#EF4444<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tg-swatch\">\n        <div class=\"tg-swatch-color\" style=\"background:#2563EB\"><\u0
