<!-- Pen Plotter Control - the app icon.
     Built to targz-design-system/docs/APP-ICONS.md.

     FULL BLEED. NO CORNERS, NO SHADOW, NO MARGIN OF OUR OWN. macOS 26 masks
     the icon itself and draws its own shadow, so art that arrives with a 100px
     inset, its own squircle and its own drop shadow is a smaller icon sitting
     on a WHITE PLATE the system puts behind it. Everything the system supplies
     has to come out: the colour runs edge to edge across the whole 1024, and
     the mark is scaled by 1024/824 so it keeps the size it had relative to the
     plate it used to sit in.

     ONE PLATE FOR ALL THREE APPS. The hue is not what tells them apart - the
     mark is. Three steps of one family read as three near-misses of the same
     colour at dock size.

     THE MARK IS THE TOOL, NOT ITS OUTPUT. A field of strokes is what any
     drawing machine leaves; the tip is what THIS one holds. A marker and not a
     pen, because this machine's PUMP dips BELOW pen-down to re-prime, which is
     something only an ink-fed tip needs.

     The PNG and the .icns are built FROM this file, see the doc. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#ffda6b"/>
      <stop offset="1" stop-color="#de920d"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <!-- the mark, grown by 1024/824 about the centre: it used to be measured
       against the 824 plate, and the plate is the whole canvas now -->
  <g transform="translate(512,512) scale(1.24272) translate(-512,-512)">
    <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round">
      <path d="M369 288 L655 276 L655 392 L369 392 Z" stroke-width="52"/>
      <path d="M433 454 L591 454 L568 544 L456 544 Z" stroke-width="32"/>
      <path d="M470 606 L554 606 C554 706 530 772 512 792 C494 772 470 706 470 606 Z"
            stroke-width="16"/>
    </g>
  </g>
</svg>
