<!-- Terminass - the app icon.
     Built to targz-design-system/docs/APP-ICONS.md.

     FULL BLEED, AND THE CORNER IS ON THE CANVAS EDGE. What macOS 26 puts a
     white plate behind is the MARGIN, not the curve: a 100px inset leaves a
     band of nothing around the art and the system fills it. So the inset goes,
     the drop shadow goes (the system draws its own), the white rim goes (it
     sat on the edge a mask eats) - and the corner stays, at `rx=229`, which is
     22.37% of 1024, the radius macOS masks with. Drawn at full size the two
     agree: there is no band for a plate, and if the system does not mask, the
     curve is ours. A plain square would have neither.

     The mark is scaled by 1024/824 so it keeps the size it had relative to the
     plate it used to sit in.

     ONE PLATE FOR ALL THREE APPS. The hue is not what tells them apart - the
     mark is. Three steps of one family read as three near-misses of the same
     colour at dock size.

     THE MARK IS UNTOUCHED. This icon was the one the other two were measured
     against; only its container has changed.

     The PNG and the .icns are built FROM this file, see the doc. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#ffda6b"/>
      <stop offset="1" stop-color="#de920d"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="229" fill="url(#g)"/>
  <!-- the mark, grown by 1024/824 about the centre: it used to be measured
       against the 824 plate, and the plate is the whole canvas now -->
  <g transform="translate(512,512) scale(1.24272) translate(-512,-512)">
    <g fill="none" stroke="#ffffff" stroke-width="62"
       stroke-linecap="round" stroke-linejoin="round">
      <polyline points="330,392 486,512 330,632"/>
      <line x1="548" y1="632" x2="706" y2="632"/>
    </g>
  </g>
</svg>
