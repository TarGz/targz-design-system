<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skew Design System</title>
<link rel="stylesheet" href="physical-ui.css">
<link rel="stylesheet" href="physical-ui-home.css">
</head>
<body>
<script src="physical-ui-nav.js"></script>

<div class="wrap" id="main">

  <div class="masthead">
    <h1>Skew Design System</h1>
    <p class="lede">
      A vibe coded design system, used for my pen control machine software and my generative art UI.
    </p>
  </div>

  <h2>01 <span>/</span> The documents</h2>
  <div class="doc-grid" id="docs"></div>

  <p class="paper-lab">Papers</p>
  <div class="papers" id="papers"></div>

  <div class="archive" id="archive"></div>

  <footer id="foot">targz design system · skew</footer>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   THE HOME, and it is a door rather than a document. No component lives here
   and no component is specified here: that is what SYSTEM is for. What this
   page owns is the answer to "what exists and where do I go", which is the
   one question the other three cannot answer about themselves.

   Both lists below are built from window.SKEW_PAGES, the same registry the
   nav bar reads, so the cards and the bar cannot disagree about what exists.
   ══════════════════════════════════════════════════════════════════════════ */

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const svg = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  open:  svg('<path d="M5 12h13"/><polyline points="12 6 18 12 12 18"/>'),
  paper: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>'),
  box:   svg('<path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><rect x="1" y="3" width="22" height="5" rx="1"/><line x1="10" y1="12" x2="14" y2="12"/>'),
};

const PAPERS = [
  ['ADOPTING-SKEW-1.14.md', 'Adopting Skew', 'what an app on the kit has to pick up'],
  ['HATCH-API.md',          'Hatch API',     'the fill generators, in millimetres'],
  ['FEATURES-REQUEST.md',   'Requests',      'what is asked for and not built'],
];

/* ── the cards ──────────────────────────────────────────────────────────── */
(function buildDocs() {
  const grid = document.getElementById('docs');

  SKEW_PAGES.filter(p => p.inGrid !== false).forEach(p => {
    const box = el('div', 'box doc');

    const head = el('div', 'box-head');
    head.append(el('span', 'nm', p.name), el('div', 'lcd', p.no));
    box.append(head);

    const body = el('div', 'doc-body');
    body.append(el('p', 'doc-kick', p.kick), el('p', 'doc-line', p.line));

    const parts = el('ul', 'doc-list');
    p.parts.forEach(t => parts.append(el('li', null, t)));
    body.append(parts);

    const foot = el('div', 'doc-foot');
    const open = el('a', 'key act go doc-open', `<span class="lens"></span>OPEN${ICON.open}`);
    open.href = p.file;
    foot.append(open, el('span', 'tagcut doc-file', p.file));
    body.append(foot);

    box.append(body);
    grid.append(box);
  });
})();

/* ── the papers ─────────────────────────────────────────────────────────── */
(function buildPapers() {
  const well = document.getElementById('papers');
  PAPERS.forEach(([file, name, line]) => {
    const a = el('a', 'paper', `${ICON.paper}<b>${name}</b>`);
    a.href = file;
    a.append(el('span', null, line), el('span', 'tagcut', file));
    well.append(a);
  });
})();

/* ── THE ARCHIVE. One line, at the foot, and deliberately not a card: it is
      not a document in this system, it is the thing this system proposes to
      replace. A card would put it in the same row as the three pages and make
      it look like a fourth destination. ─────────────────────────────────── */
(function buildArchive() {
  const a = document.getElementById('archive');
  const link = el('a', 'arch-link', `${ICON.box}<b>${SKEW_ARCHIVE.name}</b>`);
  link.href = SKEW_ARCHIVE.file;
  link.append(el('span', null, SKEW_ARCHIVE.line), el('span', 'tagcut', SKEW_ARCHIVE.file));
  a.append(el('p', 'paper-lab', 'Archive'), link);
})();

/* the footer states the version, read from the same place the nav window is */
import('./version.js')
  .then(m => {
    document.getElementById('foot').textContent =
      `targz design system · skew · v${m.version}`;
  })
  .catch(() => {});
</script>
</body>
</html>
